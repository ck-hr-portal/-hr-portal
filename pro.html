<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CK Portal · PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#1C3557;--gold:#C9A84C;--bg:#F4F6F9;--ink:#26303D;--muted:#6B7685;--line:#E3E7ED;--soft:#EEF2F7;--good:#2E8B6A;--warn:#C27C0E;--bad:#C0392B;--blue:#3E7CC4;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
.pbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;flex-wrap:wrap}
.pbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);margin-right:10px}.pbar .logo i{width:26px;height:26px;border-radius:7px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:700 11px Georgia;font-style:normal}
.mod{font:inherit;font-size:13.5px;border:none;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--ink)}.mod.on{background:var(--navy);color:#fff}
.pbar .user{margin-left:auto;font-size:12.5px;color:var(--muted)}.pbar .user b{color:var(--ink)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 47px)}
aside{background:var(--navy);color:#DCE4EF;padding:14px 10px;position:sticky;top:47px;height:calc(100vh - 47px);overflow:auto}
.grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8EA2BF;margin:12px 10px 4px}
.ni{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:8px;color:#C9D4E3;font-size:13.5px;cursor:pointer}.ni:hover{background:rgba(255,255,255,.08)}.ni.on{background:var(--gold);color:#1b1b1b;font-weight:600}
main{padding:20px 26px 50px;max-width:1260px;width:100%}
h1{font-size:22px;margin:0 0 4px;color:var(--navy)}.sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}.card h2{font-size:15.5px;margin:0 0 4px;color:var(--navy)}.note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}.tile{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:12px;padding:12px 14px}.tile .k{font-size:12px;color:var(--muted)}.tile .v{font:400 24px/1.2 Georgia,serif;color:var(--navy)}.tile .n{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr));gap:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--navy);background:var(--soft);font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}td.r,th.r{text-align:right}
.tw{overflow:auto;max-height:520px}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap}.g{background:#E5F4EE;color:var(--good)}.a{background:#FDF2DE;color:var(--warn)}.rd{background:#FBE7E5;color:var(--bad)}.nv{background:var(--soft);color:var(--navy)}
.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.gd{background:var(--gold);border-color:var(--gold);color:#1b1b1b}.btn.sm{font-size:12px;padding:3px 9px}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}textarea{width:100%;min-height:54px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.banner{background:#FFF8EA;border:1px solid #F0D9A6;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}.banner.i{background:#EEF2F7;border-color:#D6DEE8}
.modal{position:fixed;inset:0;background:rgba(23,35,56,.35);z-index:40;display:grid;place-items:center;padding:16px}.modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}.fg .full{grid-column:1/-1}.fg input,.fg select,.fg textarea{width:100%}
.pc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;border-left:5px solid var(--good)}.pc.a{border-left-color:var(--warn)}.pc.r{border-left-color:var(--bad)}.pc h3{margin:0 0 2px;color:var(--navy);font-size:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}.kv div{background:var(--soft);border-radius:8px;padding:6px 9px;font-size:12px;color:var(--muted)}.kv b{display:block;font-size:15px;color:var(--navy)}
.upd{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.upd img{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;min-width:60px}.bar i{display:block;height:100%}
.mbar{height:14px;border-radius:7px;background:var(--soft);overflow:hidden;margin:3px 0 8px}.mbar i{display:block;height:100%}
.hide{display:none!important}.err{color:var(--bad);font-size:12.5px}.small{font-size:12px;color:var(--muted)}
#gate{display:grid;place-items:center;min-height:70vh}#gate .card{max-width:460px;text-align:center}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.fg{grid-template-columns:1fr}main{padding:16px 14px 40px}}
</style></head><body>
<div class="pbar"><span class="logo"><i>CK</i>CK Portal</span><button class="mod" id="toHR" title="Back to the HR Portal tab">HR</button><button class="mod on">PRO</button><span class="user" id="who">Checking your sign-in…</span></div>
<div id="gate"><div class="card"><h2 id="gateT">Opening PRO…</h2><p class="note" id="gateM">One moment.</p><div id="gateB"></div></div></div>
<div class="app hide" id="app"><aside><div class="grp">PRO</div><div id="nav"></div><div class="grp">Other modules</div><div class="ni" id="toHR2">🏠 HR Portal</div></aside><main id="main"></main></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, onValue, set as _set, update as _update, push as _push, remove as _remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { initializeAuth, browserSessionPersistence, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const FC={apiKey:"AIzaSyA_NToPyXvchX3XrApN937DpDcWOoJ7LTY",authDomain:"ck-hr-project.firebaseapp.com",databaseURL:"https://ck-hr-project-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ck-hr-project",storageBucket:"ck-hr-project.firebasestorage.app",messagingSenderId:"552309455585",appId:"1:552309455585:web:8e8ee62306cece974c15a0"};
const app=initializeApp(FC),db=getDatabase(app),auth=initializeAuth(app,{persistence:browserSessionPersistence});
const ADMINS={'dev@ckhr.internal':'Dev Mandrekar','darleendy@ckhr.internal':'Darleendy'};const CEO='cem@ckhr.internal',PRO='kashif@ckhr.internal';

// ── Safety lock: this page writes only inside pro/. The one exception is HR's "Add to Total Cost Analysis", which adds new cost entries (never changes existing ones).
const okPath=p=>typeof p==='string'&&/^pro\//.test(p)&&!p.includes('..');
function guard(p){if(!okPath(p))throw new Error('Blocked: the PRO module only writes to pro/ ('+p+')');if(ROLE==='ceo')throw new Error('View only')}
const W={set:(p,v)=>{guard(p);return _set(ref(db,p),v)},update:(p,v)=>{if(p!=='pro')guard(p);if(ROLE==='ceo')throw new Error('View only');Object.keys(v).forEach(k=>guard(p+'/'+k));return _update(ref(db,p),v)},push:(p,v)=>{guard(p+'/x');return _push(ref(db,p),v)},remove:p=>{guard(p);return _remove(ref(db,p))},
 addCostEntry:v=>{if(ROLE!=='hr')throw new Error('Only HR can add to the Total Cost Analysis');return _set(_push(ref(db,'costEntries')),v)}};
window.__proGuard=okPath;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ds(new Date());const fmtD=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';
const aed=v=>v==null||isNaN(v)?'—':'AED '+(Math.round(v*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const tile=(k,v,n)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n||''}</div></div>`;
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const keyOf=s=>norm(s).replace(/ /g,'_').slice(0,90)||'x';
const num=x=>{const n=parseFloat(String(x==null?'':x).replace(/,/g,''));return isNaN(n)?0:n};
const toHR=()=>{try{if(window.opener&&!window.opener.closed){window.opener.focus();window.close();return}}catch(e){}location.href='./index.html'};$('toHR').onclick=toHR;$('toHR2').onclick=toHR;

let ROLE='',ME='',PG='tx';const P={tx:{},map:{},cash:{},exp:{},uploads:{}};let EMP={},CE={};let FLT={m:'',type:'',q:'',st:''};
function gate(t,m,b){$('gate').classList.remove('hide');$('app').classList.add('hide');$('gateT').textContent=t;$('gateM').textContent=m;$('gateB').innerHTML=b||''}
onAuthStateChanged(auth,async u=>{
 if(!u){$('who').textContent='Not signed in';gate('Sign in to PRO','Same username and password as the HR Portal.',`<div style="display:grid;gap:8px;text-align:left;margin-top:6px"><input id="lgU" placeholder="Username" autocomplete="username"><input id="lgP" type="password" placeholder="Password" autocomplete="current-password"><button class="btn p" id="lgB">Sign in</button><span class="err" id="lgE"></span></div>`);
  const go=async()=>{const raw=$('lgU').value.trim().toLowerCase(),pw=$('lgP').value;if(!raw||!pw){$('lgE').textContent='Enter your username and password.';return}$('lgB').disabled=true;try{await signInWithEmailAndPassword(auth,raw.includes('@')?raw:raw+'@ckhr.internal',pw)}catch(e){$('lgE').textContent='Sign-in failed: please check the username and password.';$('lgB').disabled=false}};$('lgB').onclick=go;$('lgP').onkeydown=e=>{if(e.key==='Enter')go()};return}
 const em=(u.email||'').toLowerCase();if(ADMINS[em]){ROLE='hr';ME=ADMINS[em]}else if(em===PRO){ROLE='pro';ME='Kashif'}else if(em===CEO){ROLE='ceo';ME='Cem Kapancioglu'}else{gate('No access','The PRO module is for the PRO, HR and Mr. Cem.');return}
 $('who').innerHTML='Signed in · <b>'+esc(ME)+'</b> · '+({hr:'HR',pro:'PRO',ceo:'CEO (view)'}[ROLE]);listen()});
function listen(){['tx','map','cash','exp','uploads'].forEach(k=>onValue(ref(db,'pro/'+k),s=>{P[k]=s.val()||{};draw()},()=>{P[k]={};draw()}));onValue(ref(db,'employees'),s=>{EMP=s.val()||{};draw()},()=>{EMP={}});if(ROLE==='hr')onValue(ref(db,'costEntries'),s=>{CE=s.val()||{};draw()},()=>{})}
const canEdit=()=>ROLE==='hr'||ROLE==='pro';const RO=()=>ROLE==='ceo'?'<div class="banner i">View only.</div>':'';
const empName=k=>(EMP[k]||{}).name||'';
const empOpts=v=>Object.entries(EMP).filter(([k,e])=>e&&e.name&&e.status!=='Inactive').sort((a,b)=>String(a[1].name).localeCompare(b[1].name)).map(([k,e])=>`<option value="${k}"${k===v?' selected':''}>${esc(e.name)} · ${esc(e.empId||'')}</option>`).join('');

// ── matching a name in Kashif's file to an HR Portal employee (exact name, then all words, then remembered choice)
function matchEmp(name){const n=norm(name);if(!n)return '';const mk=(P.map||{})[keyOf(name)];if(mk&&EMP[mk])return mk;const E=Object.entries(EMP).filter(([k,e])=>e&&e.name);let f=E.find(([k,e])=>norm(e.name)===n);if(f)return f[0];const w=n.split(' ').filter(x=>x.length>1);const c=E.filter(([k,e])=>{const en=norm(e.name);return w.every(x=>en.split(' ').includes(x))});if(c.length===1)return c[0][0];const c2=E.filter(([k,e])=>{const ew=norm(e.name).split(' ');return ew.filter(x=>x.length>1).every(x=>w.includes(x))});return c2.length===1?c2[0][0]:''}
const txEmp=t=>t.empKey&&EMP[t.empKey]?t.empKey:matchEmp(t.name);

// ── reading Kashif's PRO report exactly as it is: one tab per kind of work (New visa, Visa renewal, Cancellations, Update file & passport, Pension…)
const xdate=v=>{if(v instanceof Date)return ds(v);if(typeof v==='number'&&v>20000&&v<80000)return ds(new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5));const m=/(\d{4})-(\d{2})-(\d{2})/.exec(String(v||''));if(m)return m[0];const m2=/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/.exec(String(v||''));return m2?m2[3]+'-'+m2[2].padStart(2,'0')+'-'+m2[1].padStart(2,'0'):''};
const kindOf=s=>{const x=norm(s);return /new visa/.test(x)?'New visa':/renew/.test(x)?'Visa renewal':/cancel/.test(x)?'Cancellation':/passport|update file|file/.test(x)?'File / passport update':/pension/.test(x)?'Pension':s.trim().slice(0,40)};
function readProFile(wb){const out=[],skipped=[];wb.SheetNames.forEach(sn=>{const ws=wb.Sheets[sn];if(!ws||(wb.Workbook&&wb.Workbook.Sheets&&(wb.Workbook.Sheets.find(x=>x.name===sn)||{}).Hidden))return;const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  let hi=-1;for(let i=0;i<Math.min(rows.length,10);i++){const r=rows[i].map(x=>norm(x));if(r.includes('name')&&r.includes('total')){hi=i;break}}if(hi<0){skipped.push(sn);return}
  const H=rows[hi].map(x=>String(x||'').trim());const ni=H.findIndex(x=>norm(x)==='name'),ti=H.findIndex(x=>norm(x)==='total');const steps=[];H.forEach((h,j)=>{if(j>ni&&j<ti&&h)steps.push({name:h,col:j})});const kind=kindOf(sn);
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];const name=String(r[ni]||'').trim();if(!name||/^total$/i.test(name))continue;const st=[];steps.forEach((s,k)=>{const end=k+1<steps.length?steps[k+1].col:ti;let d='',a=0;for(let j=s.col;j<end;j++){const v=r[j];const dd=xdate(v);if(dd&&!d)d=dd;else if(typeof v==='number'&&v<1e6&&!(v>20000&&v<80000&&!a&&!d))a+=v;else if(typeof v==='string'&&!isNaN(+v.replace(/,/g,''))&&v.trim())a+=+v.replace(/,/g,'')}if(d||a)st.push({s:s.name,d,a:Math.round(a*100)/100})});
   const tot=num(r[ti])||Math.round(st.reduce((s,x)=>s+x.a,0)*100)/100;if(!tot&&!st.length)continue;const dates=st.map(x=>x.d).filter(Boolean).sort();const visaStep=st.find(x=>/^visa$/i.test(x.s.trim()))||st.find(x=>/visa/i.test(x.s)&&!/insurance/i.test(x.s));
   const date=(visaStep&&visaStep.d)||dates.at(-1)||'';const company=kind==='Pension'||/pension|local/i.test(name)&&!/[a-z]+ [a-z]+ [a-z]+/i.test(name)?true:false;
   const id=keyOf(kind+' '+name+' '+(dates[0]||date||tot));out.push({id,kind,name,steps:st,total:tot,date,first:dates[0]||date,company:kind==='Pension'})}});return {rows:out,skipped}}

// ── cost month and spread: visas over 24 months, everything else in the month done
const spreadOf=kind=>/new visa|renewal/i.test(kind)?24:1;
function costEntryFor(t,ek){const m=(t.date||t.first||today()).slice(0,7);return {cat:'Visa & labour card',spread:spreadOf(t.kind),label:String(t.name).slice(0,100),scope:'employee',target:ek,amount:Math.round(t.total*100)/100,mode:'total',month:m,from:m,to:m,note:('From the PRO report: '+t.kind+(t.date?' ('+t.date+')':'')).slice(0,200),by:ME,ts:Date.now(),src:'pro',proId:t.id}}

// ── navigation and pages
function nav(){const N=[['tx','🛂 PRO transactions'],['upload','📤 Upload PRO report'],['cash','💵 Petty cash'],...(ROLE==='hr'?[['tca','📊 Total Cost Analysis']]:[])];if(!N.some(x=>x[0]===PG))PG=N[0][0];
 $('nav').innerHTML=N.map(([k,l])=>`<div class="ni ${k===PG?'on':''}" data-p="${k}">${l}</div>`).join('');$('nav').querySelectorAll('[data-p]').forEach(n=>n.onclick=()=>{PG=n.dataset.p;draw();window.scrollTo(0,0)})}
function draw(){if(!ROLE)return;$('gate').classList.add('hide');$('app').classList.remove('hide');nav();$('main').innerHTML=(V[PG]||V.tx)();wire()}
const txList=()=>Object.values(P.tx||{}).filter(Boolean).sort((a,b)=>String(b.date||b.first).localeCompare(String(a.date||a.first)));
const stOf=t=>((P.exp||{})['tx_'+t.id]||{});
const recLbl=r=>r.settled?'<span class="pill g">Settled</span>':r.submitted?'<span class="pill nv">Receipt submitted</span>':'<span class="pill a">Receipt not submitted</span>';
const V={
tx(){const L=txList().filter(t=>(!FLT.m||String(t.date||t.first).startsWith(FLT.m))&&(!FLT.type||t.kind===FLT.type)&&(!FLT.q||norm(t.name).includes(norm(FLT.q)))&&(!FLT.st||(FLT.st==='nomatch'?(!t.company&&!txEmp(t)):FLT.st==='open'?!stOf(t).settled:true)));
 const kinds=[...new Set(txList().map(t=>t.kind))].sort();const months=[...new Set(txList().map(t=>String(t.date||t.first).slice(0,7)).filter(Boolean))].sort().reverse();
 const tot=L.reduce((s,t)=>s+t.total,0),by={};L.forEach(t=>by[t.kind]=(by[t.kind]||0)+t.total);const nm=txList().filter(t=>!t.company&&!txEmp(t)).length;
 return `<h1>PRO transactions</h1><p class="sub">From the PRO report, uploaded exactly as Kashif keeps it. Each person is linked to the HR Portal by name.</p>${RO()}
 <div class="tiles">${tile('Transactions',L.length,'')+tile('Total cost',aed(tot),'')+Object.entries(by).slice(0,4).map(([k,v])=>tile(esc(k),aed(v),'')).join('')}</div>
 ${nm?`<div class="banner">${nm} name${nm>1?'s':''} could not be matched to an HR Portal employee. Choose the person in the "Employee" column once; it is remembered for later uploads.</div>`:''}
 <div class="card"><div class="row"><select id="fM"><option value="">All months</option>${months.map(m=>`<option${m===FLT.m?' selected':''}>${m}</option>`).join('')}</select><select id="fT"><option value="">All kinds</option>${kinds.map(k=>`<option${k===FLT.type?' selected':''}>${esc(k)}</option>`).join('')}</select><select id="fS"><option value="">All</option><option value="open"${FLT.st==='open'?' selected':''}>Receipts not settled</option><option value="nomatch"${FLT.st==='nomatch'?' selected':''}>Name not matched</option></select><input id="fQ" placeholder="Search name" value="${esc(FLT.q)}"><span style="flex:1"></span><button class="btn gd sm" id="txX">📥 Excel</button></div>
 <div class="tw"><table><tr><th>Date</th><th>Kind</th><th>Name in the report</th><th>Employee (HR Portal)</th><th>Steps</th><th class="r">Total</th><th>Receipts</th><th>Cost analysis</th></tr>${L.map(t=>{const ek=txEmp(t),r=stOf(t);return `<tr><td>${fmtD(t.date||t.first)}</td><td>${esc(t.kind)}</td><td>${esc(t.name)}</td><td>${t.company?'<span class="small">company level</span>':canEdit()?`<select data-map="${esc(t.id)}"><option value="">${ek?'':'— choose —'}</option>${empOpts(ek)}</select>`:esc(empName(ek)||'not matched')}</td><td class="small">${t.steps.map(s=>esc(s.s)+(s.a?' '+s.a.toLocaleString('en-US'):'')).join(' · ')}</td><td class="r"><b>${aed(t.total)}</b></td><td>${recLbl(r)}${canEdit()?`<div style="margin-top:4px"><select data-rec="tx_${esc(t.id)}"><option value="">change…</option><option value="none">Not submitted</option><option value="sub">Receipt submitted today</option><option value="set">Settled today</option></select></div>`:''}</td><td>${t.company?'<span class="small">—</span>':t.sentAt?'<span class="pill g">added</span>':'<span class="small">not yet</span>'}</td></tr>`}).join('')||'<tr><td colspan="8" class="note">No transactions yet. Upload the PRO report.</td></tr>'}</table></div></div>`},
upload(){const U=UP;return `<h1>Upload PRO report</h1><p class="sub">The PRO report Excel exactly as it is kept (tabs such as NEW VISA, VISA RENEWAL, CANCELLATIONS, Update file &amp; passport, Pension). Uploading again updates the same transactions, never duplicates them.</p>${RO()}
 ${canEdit()?`<div class="card"><input type="file" id="pf" accept=".xlsx,.xls,.xlsm"><div id="pOut" style="margin-top:10px">${U?upHTML():''}</div></div>`:''}
 <div class="card"><h2>Uploads</h2><table><tr><th>When</th><th>By</th><th>File</th><th class="r">Transactions</th><th class="r">New</th></tr>${Object.values(P.uploads||{}).sort((a,b)=>b.at-a.at).slice(0,20).map(u=>`<tr><td>${new Date(u.at).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(u.by)}</td><td>${esc(u.file)}</td><td class="r">${u.n}</td><td class="r">${u.added}</td></tr>`).join('')||'<tr><td colspan="5" class="note">None yet.</td></tr>'}</table></div>`},
cash(){const C=Object.entries(P.cash||{}).map(([id,c])=>Object.assign({id},c)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));const X=Object.entries(P.exp||{}).filter(([k,e])=>!k.startsWith('tx_')).map(([id,e])=>Object.assign({id},e)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 const T=txList();const rec=C.reduce((s,c)=>s+num(c.amount),0);const spentTx=T.reduce((s,t)=>s+t.total,0),spentX=X.reduce((s,e)=>s+num(e.amount),0),spent=spentTx+spentX;
 const st=[...T.map(t=>({a:t.total,r:stOf(t)})),...X.map(e=>({a:num(e.amount),r:e}))];const settled=st.filter(x=>x.r.settled).reduce((s,x)=>s+x.a,0),submitted=st.filter(x=>x.r.submitted&&!x.r.settled).reduce((s,x)=>s+x.a,0),notsub=st.filter(x=>!x.r.submitted&&!x.r.settled).reduce((s,x)=>s+x.a,0);
 return `<h1>Petty cash</h1><p class="sub">Cash received from Finance, what it was spent on (PRO transactions and other expenses), and whether the receipts were submitted and settled.</p>${RO()}
 <div class="tiles">${tile('Cash received',aed(rec),C.length+' times')+tile('Spent',aed(spent),'PRO transactions '+aed(spentTx)+' · other '+aed(spentX))+tile('Balance in hand',aed(rec-spent),rec-spent<0?'more spent than received':'')+tile('Receipts settled',aed(settled),'')+tile('Receipts submitted, not settled',aed(submitted),'')+tile('Receipts not yet submitted',aed(notsub),'')}</div>
 <div class="grid2"><div class="card"><h2>Cash received from Finance</h2>${canEdit()?`<div class="row"><input type="date" id="cD" value="${today()}"><input type="number" step="any" id="cA" placeholder="Amount (AED)" style="width:130px"><input id="cF" placeholder="Given by (e.g. Finance, Vishal)" style="flex:1"><button class="btn p sm" id="cAdd">+ Add</button></div>`:''}
 <table><tr><th>Date</th><th class="r">Amount</th><th>Given by</th><th>Entered by</th>${canEdit()?'<th></th>':''}</tr>${C.map(c=>`<tr><td>${fmtD(c.date)}</td><td class="r">${aed(num(c.amount))}</td><td>${esc(c.from)}</td><td class="small">${esc(c.by)}</td>${canEdit()?`<td><button class="btn sm" data-delc="${c.id}">✕</button></td>`:''}</tr>`).join('')||'<tr><td colspan="5" class="note">Nothing recorded yet.</td></tr>'}</table></div>
 <div class="card"><h2>Other expenses (not in the PRO report)</h2>${canEdit()?`<div class="row"><input type="date" id="xD" value="${today()}"><input type="number" step="any" id="xA" placeholder="Amount (AED)" style="width:130px"><input id="xT" placeholder="What for (e.g. typing, courier)" style="flex:1"><button class="btn p sm" id="xAdd">+ Add</button></div>`:''}
 <table><tr><th>Date</th><th>What for</th><th class="r">Amount</th><th>Receipt</th></tr>${X.map(e=>`<tr><td>${fmtD(e.date)}</td><td>${esc(e.text)}</td><td class="r">${aed(num(e.amount))}</td><td>${recLbl(e)}${canEdit()?`<div style="margin-top:4px"><select data-rec="${e.id}"><option value="">change…</option><option value="none">Not submitted</option><option value="sub">Receipt submitted today</option><option value="set">Settled today</option></select></div>`:''}</td></tr>`).join('')||'<tr><td colspan="4" class="note">None.</td></tr>'}</table></div></div>
 <div class="card"><h2>Receipts by month</h2><table><tr><th>Month</th><th class="r">Spent</th><th class="r">Settled</th><th class="r">Submitted, not settled</th><th class="r">Not yet submitted</th></tr>${(()=>{const M={};[...T.map(t=>({m:String(t.date||t.first).slice(0,7),a:t.total,r:stOf(t)})),...X.map(e=>({m:String(e.date).slice(0,7),a:num(e.amount),r:e}))].forEach(x=>{const o=M[x.m]=M[x.m]||[0,0,0,0];o[0]+=x.a;if(x.r.settled)o[1]+=x.a;else if(x.r.submitted)o[2]+=x.a;else o[3]+=x.a});return Object.entries(M).sort((a,b)=>b[0].localeCompare(a[0])).map(([m,o])=>`<tr><td>${esc(m)}</td><td class="r">${aed(o[0])}</td><td class="r">${aed(o[1])}</td><td class="r">${aed(o[2])}</td><td class="r" style="color:${o[3]?'#C27C0E':'inherit'}">${aed(o[3])}</td></tr>`).join('')||'<tr><td colspan="5" class="note">Nothing yet.</td></tr>'})()}</table></div>`},
tca(){const T=txList().filter(t=>!t.company);const ready=T.filter(t=>!t.sentAt&&txEmp(t));const nomatch=T.filter(t=>!t.sentAt&&!txEmp(t));const sent=T.filter(t=>t.sentAt);
 return `<h1>Add to Total Cost Analysis</h1><p class="sub">Adds PRO costs to the HR Portal's Total Cost Analysis as "Visa &amp; labour card" entries for the person, in the month of the visa (or the last step). Each transaction is added once; the project labour cost then spreads new visas and renewals over 24 months.</p>
 <div class="tiles">${tile('Ready to add',ready.length,aed(ready.reduce((s,t)=>s+t.total,0)))+tile('Name not matched',nomatch.length,'match them first')+tile('Already added',sent.length,aed(sent.reduce((s,t)=>s+t.total,0)))}</div>
 <div class="card"><div class="row"><button class="btn p" id="tcaAdd" ${ready.length?'':'disabled'}>Add ${ready.length} transaction${ready.length===1?'':'s'} to the Total Cost Analysis</button></div>
 <table><tr><th>Date</th><th>Kind</th><th>Employee</th><th class="r">Amount</th><th>Month counted</th></tr>${ready.map(t=>`<tr><td>${fmtD(t.date||t.first)}</td><td>${esc(t.kind)}</td><td>${esc(empName(txEmp(t)))}</td><td class="r">${aed(t.total)}</td><td>${esc((t.date||t.first||'').slice(0,7))}</td></tr>`).join('')||'<tr><td colspan="5" class="note">Nothing waiting.</td></tr>'}</table></div>`}};
let UP=null;
function upHTML(){const U=UP;if(!U)return '';const by={};U.rows.forEach(r=>by[r.kind]=(by[r.kind]||0)+1);const nm=U.rows.filter(r=>!r.company&&!matchEmp(r.name));const ex=U.rows.filter(r=>(P.tx||{})[r.id]);
 return `<p><b>${esc(U.file)}</b> · ${U.rows.length} transactions (${Object.entries(by).map(([k,n])=>esc(k)+' '+n).join(', ')}) · total ${aed(U.rows.reduce((s,r)=>s+r.total,0))}</p>
 ${ex.length?`<p class="small">${ex.length} already in the portal from an earlier upload: they will be updated, not duplicated.</p>`:''}${nm.length?`<div class="banner">Names not matched to the HR Portal (choose them after saving): ${nm.slice(0,10).map(r=>esc(r.name)).join(', ')}${nm.length>10?' and '+(nm.length-10)+' more':''}</div>`:''}${U.skipped.length?`<p class="small">Tabs without NAME and TOTAL headings were skipped: ${U.skipped.map(esc).join(', ')}</p>`:''}
 <div class="row"><button class="btn p" id="pSave">Save</button><button class="btn" id="pCancel">Cancel</button></div>`}
function wire(){
 if($('fM'))$('fM').onchange=e=>{FLT.m=e.target.value;draw()};if($('fT'))$('fT').onchange=e=>{FLT.type=e.target.value;draw()};if($('fS'))$('fS').onchange=e=>{FLT.st=e.target.value;draw()};if($('fQ'))$('fQ').oninput=e=>{FLT.q=e.target.value;const p=e.target.selectionStart;draw();const x=$('fQ');x.focus();x.setSelectionRange(p,p)};
 document.querySelectorAll('[data-map]').forEach(s=>s.onchange=async()=>{const t=(P.tx||{})[s.dataset.map];if(!t)return;try{await W.update('pro',{['tx/'+t.id+'/empKey']:s.value||null,['map/'+keyOf(t.name)]:s.value||null})}catch(e){alert(e.message)}});
 document.querySelectorAll('[data-rec]').forEach(s=>s.onchange=async()=>{const k=s.dataset.rec,v=s.value;if(!v)return;const cur=(P.exp||{})[k]||{};const o=Object.assign({},cur);if(v==='none'){delete o.submitted;delete o.settled}if(v==='sub'){o.submitted=today();delete o.settled}if(v==='set'){o.settled=today();o.submitted=o.submitted||today()}o.upd=Date.now();o.by=ME;try{await W.set('pro/exp/'+k,o)}catch(e){alert(e.message)}});
 if($('pf'))$('pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});const r=readProFile(wb);if(!r.rows.length)throw new Error('No transactions found. Is this the PRO report (tabs with NAME and TOTAL headings)?');UP=Object.assign(r,{file:f.name});$('pOut').innerHTML=upHTML();wire()}catch(err){$('pOut').innerHTML='<span class="err">'+esc(err.message)+'</span>'}e.target.value=''};
 if($('pCancel'))$('pCancel').onclick=()=>{UP=null;draw()};
 if($('pSave'))$('pSave').onclick=async()=>{const U=UP;if(!U)return;const up={};let added=0;U.rows.forEach(r=>{const old=(P.tx||{})[r.id];if(!old)added++;up['tx/'+r.id]=Object.assign({},r,{empKey:(old&&old.empKey)||matchEmp(r.name)||null,sentAt:(old&&old.sentAt)||null,ceKey:(old&&old.ceKey)||null,upd:Date.now(),by:ME})});
  up['uploads/'+Date.now()]={at:Date.now(),by:ME,file:String(U.file).slice(0,120),n:U.rows.length,added};try{await W.update('pro',up);UP=null;PG='tx';draw()}catch(e){alert(e.message)}};
 if($('cAdd'))$('cAdd').onclick=async()=>{const d=$('cD').value,a=+$('cA').value,f=$('cF').value.trim();if(!d||!(a>0)){alert('Enter the date and the amount.');return}try{await W.push('pro/cash',{date:d,amount:a,from:f.slice(0,80),by:ME,at:Date.now()})}catch(e){alert(e.message)}};
 document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this cash entry?'))return;try{await W.remove('pro/cash/'+b.dataset.delc)}catch(e){alert(e.message)}});
 if($('xAdd'))$('xAdd').onclick=async()=>{const d=$('xD').value,a=+$('xA').value,x=$('xT').value.trim();if(!d||!(a>0)||!x){alert('Enter the date, amount and what it was for.');return}try{await W.push('pro/exp',{date:d,amount:a,text:x.slice(0,120),by:ME,at:Date.now()})}catch(e){alert(e.message)}};
 if($('txX'))$('txX').onclick=()=>{const rows=[['Date','Kind','Name in the report','Employee (HR Portal)','Emp ID','Steps','Total (AED)','Receipt submitted','Settled','In Total Cost Analysis']];txList().forEach(t=>{const ek=txEmp(t),r=stOf(t);rows.push([t.date||t.first,t.kind,t.name,t.company?'company level':empName(ek),(EMP[ek]||{}).empId||'',t.steps.map(s=>s.s+(s.a?' '+s.a:'')).join(' · '),t.total,r.submitted||'',r.settled||'',t.sentAt?'yes':''])});const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:11},{wch:18},{wch:26},{wch:26},{wch:14},{wch:60},{wch:12},{wch:14},{wch:12},{wch:12}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'PRO transactions');XLSX.writeFile(wb,'PRO-Transactions-'+today()+'.xlsx')};
 if($('tcaAdd'))$('tcaAdd').onclick=async()=>{const R=txList().filter(t=>!t.company&&!t.sentAt&&txEmp(t));if(!confirm('Add '+R.length+' PRO transactions to the Total Cost Analysis as "Visa & labour card"?'))return;let n=0;try{for(const t of R){const ek=txEmp(t);await W.addCostEntry(costEntryFor(t,ek));await W.update('pro',{['tx/'+t.id+'/sentAt']:Date.now(),['tx/'+t.id+'/empKey']:ek});n++}alert(n+' added.')}catch(e){alert('Stopped after '+n+': '+e.message)}};
}
</script>
