<style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import { initializeAuth, browserSessionPersistence, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const FC={apiKey:"AIzaSyA_NToPyXvchX3XrApN937DpDcWOoJ7LTY",authDomain:"ck-hr-project.firebaseapp.com",databaseURL:"https://ck-hr-project-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ck-hr-project",storageBucket:"ck-hr-project.firebasestorage.app",messagingSenderId:"552309455585",appId:"1:552309455585:web:8e8ee62306cece974c15a0"};
const app=initializeApp(FC),db=getDatabase(app),auth=initializeAuth(app,{persistence:browserSessionPersistence});
const ADMINS={'dev@ckhr.internal':'Dev Mandrekar','darleendy@ckhr.internal':'Darleendy'};const CEO='cem@ckhr.internal';

// ── Safety lock: this module only ever writes inside proj/. HR Portal data is read-only here.
const okPath=p=>typeof p==='string'&&/^proj\//.test(p)&&!p.includes('..');
function guard(p){if(!okPath(p))throw new Error('Blocked: the Projects module only writes to proj/ ('+p+')');if(ROLE==='ceo')throw new Error('View only')}
const W={set:(p,v)=>{guard(p);return _set(ref(db,p),v)},update:(p,v)=>{if(p!=='proj')guard(p);if(ROLE==='ceo')throw new Error('View only');Object.keys(v).forEach(k=>guard(p+'/'+k));return _update(ref(db,p),v)},push:(p,v)=>{guard(p+'/x');return _push(ref(db,p),v)},remove:p=>{guard(p);return _remove(ref(db,p))}};
window.__projGuard=okPath;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const today=()=>ds(new Date());const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ds(d)};
const fmtD=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'';
const aed=v=>v==null||isNaN(v)?'—':'AED '+Math.round(v).toLocaleString('en-US');
const aedM=v=>v==null||isNaN(v)?'—':(Math.abs(v)>=1e6?'AED '+(v/1e6).toFixed(2)+' m':aed(v));
const tile=(k,v,n)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n||''}</div></div>`;
const keyOf=s=>String(s||'').trim().toLowerCase().replace(/[.#$\[\]\/]/g,' ').replace(/\s+/g,' ').trim().replace(/ /g,'_').slice(0,90)||'x';
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const toHR=()=>{try{if(window.opener&&!window.opener.closed){window.opener.focus();window.close();return}}catch(e){}location.href='./index.html'};$('toHR').onclick=toHR;$('toHR2').onclick=toHR;

let ROLE='',ME='',MYKEY='',PG='all',CUR='';
const P={settings:{},projects:{},board:{},days:{},updates:{},money:{},rates:{},cost:{},staffList:{},petty:{}};let EMP={},LEAVE={};
function gate(t,m,b){$('gate').classList.remove('hide');$('app').classList.add('hide');$('gateT').textContent=t;$('gateM').textContent=m;$('gateB').innerHTML=b||''}
onAuthStateChanged(auth,async u=>{
 if(!u){$('who').textContent='Not signed in';gate('Sign in to Projects','Same username and password as the HR Portal.',`<div style="display:grid;gap:8px;text-align:left;margin-top:6px"><input id="lgU" placeholder="Username or company email" autocomplete="username"><input id="lgP" type="password" placeholder="Password" autocomplete="current-password"><button class="btn p" id="lgB">Sign in</button><span class="err" id="lgE"></span></div>`);
  const go=async()=>{const raw=$('lgU').value.trim().toLowerCase(),pw=$('lgP').value;if(!raw||!pw){$('lgE').textContent='Enter your username and password.';return}$('lgB').disabled=true;$('lgB').textContent='Signing in…';try{await signInWithEmailAndPassword(auth,raw.includes('@')?raw:raw+'@ckhr.internal',pw)}catch(e){$('lgE').textContent='Sign-in failed: please check the username and password.';$('lgB').disabled=false;$('lgB').textContent='Sign in'}};
  $('lgB').onclick=go;$('lgP').onkeydown=e=>{if(e.key==='Enter')go()};return}
 const em=(u.email||'').toLowerCase();
 if(ADMINS[em]){ROLE='hr';ME=ADMINS[em]}else if(em===CEO){ROLE='ceo';ME='Cem Kapancioglu'}
 else{let m=null;try{m=(await get(ref(db,'staffMap/'+u.uid))).val()}catch(e){}if(!m||m.enabled!==true){gate('No access','Your HR Portal access is not active. Please contact HR.');return}
  ROLE='staff';MYKEY=m.empKey;try{const v=(await get(ref(db,'staffView/'+m.empKey))).val()||{};ME=v.name||''}catch(e){}}
 $('who').innerHTML='Signed in · <b>'+esc(ME||em)+'</b> · '+({hr:'HR',ceo:'CEO (view)',staff:'Staff'}[ROLE]);listen()});
function listen(){const open=(p,k)=>onValue(ref(db,p),s=>{P[k]=s.val()||{};draw()},()=>{P[k]={};draw()});
 if(ROLE==='staff'){const subs=new Set(),subsM=new Set();let tkOn=false;const more=()=>{myProjects().forEach(pid=>{if(subs.has(pid))return;subs.add(pid);onValue(ref(db,'proj/board/'+pid),s=>{P.board[pid]=s.val()||{};draw()},()=>{});onValue(lastN('proj/updates/'+pid,20),s=>{P.updates[pid]=s.val()||{};draw()},()=>{})});
   if(isTK()&&!tkOn){tkOn=true;onValue(ref(db,'proj/staffList'),s=>{P.staffList=s.val()||{};draw()},()=>{});onValue(recent('proj/days'),s=>{P.days=s.val()||{};draw()},()=>{})}
   if(isFin())projList().forEach(([pid])=>{if(subsM.has(pid))return;subsM.add(pid);onValue(ref(db,'proj/money/'+pid),s=>{P.money[pid]=s.val()||{};draw()},()=>{});onValue(ref(db,'proj/petty/'+pid),s=>{P.petty[pid]=s.val()||{};draw()},()=>{})})};
  onValue(ref(db,'proj/settings'),s=>{P.settings=s.val()||{};more();draw()},()=>{});onValue(ref(db,'proj/projects'),s=>{P.projects=s.val()||{};more();draw()},()=>{draw()});return}
 open('proj/settings','settings');open('proj/projects','projects');
 ['board','money','rates','staffList','petty'].forEach(k=>open('proj/'+k,k));
 onValue(recent('proj/days'),s=>{P.days=Object.assign(P.days||{},s.val()||{});draw()},()=>{});onValue(recent('proj/cost'),s=>{P.cost=Object.assign(P.cost||{},s.val()||{});draw()},()=>{});
 let updSubs=new Set();const watchUpd=()=>Object.keys(P.projects||{}).forEach(pid=>{if(updSubs.has(pid))return;updSubs.add(pid);onValue(lastN('proj/updates/'+pid,20),s=>{P.updates[pid]=s.val()||{};draw()},()=>{})});onValue(ref(db,'proj/projects'),()=>setTimeout(watchUpd,50),()=>{});
 onValue(ref(db,'leave'),s=>{LEAVE=s.val()||{}},()=>{LEAVE={}});
 onValue(ref(db,'employees'),s=>{EMP=s.val()||{};draw()},()=>{EMP={}});}
const WIN=()=>addD(today(),-62);const recent=p=>query(ref(db,p),orderByKey(),startAt(WIN()));const lastN=(p,n)=>query(ref(db,p),orderByKey(),limitToLast(n));
const myProjects=()=>Object.entries(P.projects||{}).filter(([id,p])=>p&&p.team&&p.team[MYKEY]).map(([id])=>id);
const isFin=()=>!!(MYKEY&&P.settings&&P.settings.finance&&P.settings.finance[MYKEY]);
const isTK=()=>!!(MYKEY&&P.settings&&P.settings.timekeepers&&P.settings.timekeepers[MYKEY]);
const canReg=()=>ROLE==='hr'||isTK();
const isApprover=()=>!!(MYKEY&&P.settings&&P.settings.financeApprover&&P.settings.financeApprover[MYKEY]);
const S=()=>Object.assign({divisor:26,stdHours:8},P.settings||{});
const canAdmin=()=>ROLE==='hr';const canTeam=pid=>ROLE==='hr'||(ROLE==='staff'&&P.projects[pid]&&P.projects[pid].team&&P.projects[pid].team[MYKEY]);
const canMoney=()=>ROLE==='hr'||isFin();

// ── project figures
const projList=()=>Object.entries(P.projects||{}).filter(([id,p])=>p&&p.name).sort((a,b)=>(a[1].order||9)-(b[1].order||9)||String(a[1].name).localeCompare(b[1].name));
const dates=()=>Object.keys(P.days||{}).sort();
const lastDate=()=>dates().at(-1)||'';
const dayOf=(d,site)=>((P.days||{})[d]||{})[keyOf(site)]||null;
const costOf=(d,site)=>{const c=((P.cost||{})[d]||{})[keyOf(site)];if(c)return (c.own||0)+(c.sup||0);const x=dayOf(d,site);return x?(x.costOwn||0)+(x.costSup||0):0};
function weekSum(site,upTo,n){let man=0,cost=0,ds_=dates().filter(d=>d<=upTo).slice(-n);ds_.forEach(d=>{const x=dayOf(d,site);if(x){man+=x.present||0;cost+=costOf(d,site)}});return {man,cost,days:ds_.length}}
function monthSum(site,ym){let man=0,cost=0;dates().filter(d=>d.startsWith(ym)).forEach(d=>{const x=dayOf(d,site);if(x){man+=x.present||0;cost+=costOf(d,site)}});return {man,cost}}
const items=pid=>Object.entries((P.board||{})[pid]||{}).map(([id,x])=>Object.assign({id},x));
const isLate=x=>x.status!=='Done'&&x.due&&x.due<today();
const daysOpen=x=>x.created?Math.max(0,Math.round((Date.now()-x.created)/864e5)):null;
const lastUpd=pid=>Object.values((P.updates||{})[pid]||{}).sort((a,b)=>(b.at||0)-(a.at||0))[0]||null;
const latestMoney=pid=>{const m=(P.money||{})[pid]||{};const k=Object.keys(m).sort().at(-1);return k?Object.assign({month:k,asAt:k.length===7?k+'-28':k},m[k]):null};
const asAtLbl=k=>k&&k.length===7?new Date(k+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'}):fmtD(k)+' '+String(k||'').slice(0,4);
const moneyStale=lm=>lm&&lm.asAt<addD(today(),-30);
const pettyList=(pid,upTo)=>Object.entries((P.petty||{})[pid]||{}).map(([id,x])=>Object.assign({id},x)).filter(x=>!upTo||x.date<=upTo).sort((a,b)=>a.date<b.date?1:-1);
function moneyCalc(m,pid){if(!m)return null;const n=k=>+m[k]||0;const original=n('contract'),addV=n('voApproved'),omit=n('omissions');const revised=original+addV-omit;const committed=n('committed'),uncommitted=n('uncommitted'),paid=n('paid');
 const asAt=m.asAt||(m.month?(m.month.length===7?m.month+'-28':m.month):'');const PL=pid?pettyList(pid,asAt):[];const pettyIssued=PL.reduce((s,x)=>s+(+x.amount||0),0);const pettyRec=n('pettyRec'),pettyPend=n('pettyPend');
 const forecastCost=committed+uncommitted;
 return {asAt,original,addV,omit,revised,pending:n('voPending'),certified:n('certified'),received:n('received'),dueNow:n('dueNow'),overdue:n('overdue'),retention:n('retention'),future:Math.max(0,revised-n('certified')),toCollect:Math.max(0,revised-n('received')),
  committed,paid,supDue:n('supDue'),uncommitted,forecastCost,toPay:Math.max(0,committed-paid)+uncommitted,pettyIssued,pettyLast:PL[0]||null,pettyRec,pettyPend,pettyBal:pettyIssued-pettyRec-pettyPend,
  cashNow:n('received')-paid-pettyIssued,margin:revised-forecastCost,dueNet:(n('dueNow')+n('overdue'))-n('supDue'),note:m.note||''}}
function flag(pid){const p=P.projects[pid];const I=items(pid);const late=I.filter(isLate).length,blk=I.filter(x=>x.status==='Blocked').length;const u=lastUpd(pid);const stale=!u||u.date<addD(today(),-2);const m=moneyCalc(latestMoney(pid),pid);const cash=m&&m.cashNow<0;
 const lvl=(late>=3||blk>=2||cash)?'r':(late||blk||stale)?'a':'g';return {lvl,late,blk,stale,cash,u,m}}

// ── navigation
function nav(){const N=ROLE==='staff'?[...(myProjects().length||(!isTK()&&!isFin())?[['mine','📍 My projects']]:[]),...(isTK()?[['register','📋 Daily register']]:[]),...(isFin()?[['money','💰 Project money']]:[])]:[['all','🏗️ All projects'],...projList().map(([id,p])=>['p:'+id,'· '+p.name]),['register','📋 Daily register'],['labour','📊 Labour cost by month'],...(ROLE==='hr'?[['money','💰 Project money'],['rates','💲 Supply rates'],['setup','⚙️ Projects set-up']]:[['money','💰 Project money']])];
 if(!N.some(x=>x[0]===PG))PG=N[0][0];$('nav').innerHTML=N.map(([k,l])=>`<div class="ni ${k===PG?'on':''}" data-p="${esc(k)}">${esc(l)}</div>`).join('');
 $('nav').querySelectorAll('[data-p]').forEach(n=>n.onclick=()=>{PG=n.dataset.p;draw();window.scrollTo(0,0)})}
function draw(){if(!ROLE)return;if(ROLE==='hr')setTimeout(hrMaintain,1500);$('gate').classList.add('hide');$('app').classList.remove('hide');nav();
 let h='';if(PG==='all')h=V.all();else if(PG.startsWith('p:')){CUR=PG.slice(2);h=V.project(CUR)}else h=(V[PG]||V.all)();$('main').innerHTML=h;wire()}
const RO=()=>ROLE==='ceo'?'<div class="banner i">View only.</div>':'';

// ── charts (SVG, no library)
function stackChart(site,n){const D=dates().slice(-n);if(!D.length)return '<p class="note">No daily register uploaded yet.</p>';const W=640,H=200,pad=34;const vals=D.map(d=>{const x=dayOf(d,site)||{};return [x.ownPresent||0,x.supPresent||0,x.subPresent||0]});const mx=Math.max(4,...vals.map(v=>v[0]+v[1]+v[2]));const bw=(W-pad-10)/D.length;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="People on site per day">`;[0,.5,1].forEach(f=>{const y=H-24-(H-44)*f;s+=`<line x1="${pad}" x2="${W-6}" y1="${y}" y2="${y}" stroke="#E3E7ED"/><text x="${pad-6}" y="${y+4}" font-size="11" text-anchor="end" fill="#6B7685">${Math.round(mx*f)}</text>`});

function costDay(d){const D=P.days[d]||{},s=S(),byId={};Object.values(EMP).forEach(e=>{if(e&&e.empId)byId[String(e.empId).trim().toUpperCase()]=e});const out={};

function rateFor(company,trade){const R=P.rates||{};const cn=norm(company);if(!cn)return null;let c=Object.values(R).find(x=>norm(x.name)===cn||(x.aliases||[]).some(a=>norm(a)===cn));if(!c)c=Object.values(R).find(x=>[x.name,...(x.aliases||[])].some(a=>{const n=norm(a);return n&&(n.includes(cn)||cn.includes(n.split(' ').slice(0,2).join(' ')))}));
 if(!c)return {missing:'company'};if(/contract/i.test(c.basis||'')||!c.trades||!Object.keys(c.trades).length)return {contract:true,c};const tn=norm(trade);let r=Object.entries(c.trades).find(([t])=>norm(t)===tn);if(!r)r=Object.entries(c.trades).find(([t])=>/skilled worker/i.test(t)&&!/semi|un/i.test(t));if(!r)r=Object.entries(c.trades).sort((a,b)=>b[1]-a[1])[0];return {rate:+r[1],basis:c.basis,c,trade:r[0]}}
async function readRegister(file){const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const sv=n=>{const k=wb.SheetNames.find(s=>s.toLowerCase().startsWith(n));return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,raw:true,defval:''}):null};

 const byId={};staffSrc().forEach(e=>{if(e.id)byId[String(e.id).trim().toUpperCase()]=e});const s=S();
 const sites={},warn=[],stat={};const add=site=>sites[site]=sites[site]||{site,ownPresent:0,ownOther:0,supPresent:0,subPresent:0,present:0,costOwn:0,costSup:0,ot:0,trades:{},groups:{},supCo:{},subCo:{},people:[]};const ck=s=>String(s||'').replace(/[.#$\[\]\/]/g,' ').replace(/\s+/g,' ').trim().slice(0,60)||'-';
 let noStatus=0,noMatch=0,noSite=0;st.slice(hi+1).forEach(r=>{const name=String(r[c.name]||'').trim();if(!name)return;const site=String(r[c.site]||'').trim(),status=String(r[c.st]||'').trim();if(status)stat[ck(status)]=(stat[ck(status)]||0)+1;if(!status){noStatus++;return}if(!site){if(PRESENT(status))noSite++;return}const S_=add(site);const des=(String(r[c.des]||'').trim()||'Staff').replace(/[.#$\[\]\/]/g,'-').slice(0,60);
  const eid=String(r[c.id]||'').trim(),e=byId[eid.toUpperCase()];const hrs=+r[c.hrs];if(PRESENT(status)){S_.ownPresent++;S_.present++;const g=groupOf(e,des);S_.groups[g]=(S_.groups[g]||0)+1;if(!e)noMatch++;

 let supN=0,noRate=new Set();if(su){const hs=hdrIdx(su,['name','company','site']);if(hs>=0){const H2=su[hs];const d={name:col(H2,'name'),des:col(H2,'designation'),co:col(H2,'company'),type:col(H2,'type'),site:col(H2,'site'),pa:col(H2,'present'),hrs:col(H2,'hours'),ot:col(H2,'overtime')};

 modal(`<h2>${pid?'Edit':'New'} project</h2><div class="fg"><div class="full"><label>Project name *</label><input id="pN" value="${esc(p.name||'')}"></div><div class="full"><label>Site name exactly as in the daily register *</label><input id="pS" list="pSl" value="${esc(p.site||'')}"><datalist id="pSl">${sites.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div><div><label>Project manager</label><select id="pPm"><option value="">—</option>${empOpts(p.pm)}</select></div><div><label>Site manager</label><select id="pSm"><option value="">—</option>${empOpts(p.sm)}</select></div><div class="full"><label>Others in the team (can update priorities and send site updates)</label><select id="pT" multiple size="6">${empOpts('')}</select><div class="small">Ctrl + click to choose several. Current: ${Object.keys(p.team||{}).map(empName).map(esc).join(', ')||'—'}</div></div><div><label>Client</label><input id="pCl" value="${esc(p.client||'')}"></div><div><label>Contract / project reference</label><input id="pRef" value="${esc(p.ref||'')}"></div><div><label>Contract type</label><select id="pCt">${['','Lump sum','Fixed rate remeasurable','Cost plus fee','Design and build','Other'].map(x=>`<option${x===(p.ctype||'')?' selected':''}>${x}</option>`).join('')}</select></div><div><label>Project type</label><select id="pBt">${['','Villa','Garden villa','Apartment','Showroom','Office','Retail','Restaurant','Hotel','Other'].map(x=>`<option${x===(p.btype||'')?' selected':''}>${x}</option>`).join('')}</select></div><div><label>Order on the page</label><input id="pO" type="number" value="${p.order||1}"></div></div>`,
 async()=>{const n=fv('pN'),s=fv('pS');if(!n||!s)throw new Error('Enter the project name and its site.');const team={};const pm=fv('pPm'),sm=fv('pSm');if(pm)team[pm]=true;if(sm)team[sm]=true;[...$('pT').selectedOptions].forEach(o=>team[o.value]=true);if(pid)Object.keys(p.team||{}).forEach(k=>{if(![...$('pT').options].some(o=>o.value===k&&!o.selected)||k===pm||k===sm)team[k]=true});
  const k=pid||uid();await W.set('proj/projects/'+k,{name:n,site:s,pm,sm,team,client:fv('pCl'),ref:fv('pRef'),ctype:fv('pCt'),btype:fv('pBt'),order:+fv('pO')||1,upd:Date.now(),by:ME});await hist((pid?'Edited':'Added')+' project '+n)});
 if(pid){$('mDel').innerHTML='<button class="btn" id="mD" style="color:#C0392B">Delete</button>';$('mD').onclick=async()=>{if(confirm('Delete this project (its priorities, updates and money figures stay stored)?')){await W.remove('proj/projects/'+pid);document.querySelector('.modal').remove()}}}}

// ── events
let REG=null,REGHTML='',REGFILE='',TPLMSG='';
function wire(){
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{PG='p:'+b.dataset.open;draw();window.scrollTo(0,0)});
 document.querySelectorAll('[data-additem]').forEach(b=>b.onclick=()=>itemForm(b.dataset.additem,''));
 document.querySelectorAll('[data-edititem]').forEach(b=>b.onclick=()=>{const [p,i]=b.dataset.edititem.split('|');itemForm(p,i)});
 document.querySelectorAll('[data-newupd]').forEach(b=>b.onclick=()=>updForm(b.dataset.newupd));
 document.querySelectorAll('[data-money]').forEach(b=>b.onclick=()=>moneyForm(b.dataset.money));
 document.querySelectorAll('[data-editproj]').forEach(b=>b.onclick=()=>projForm(b.dataset.editproj));
 document.querySelectorAll('[data-big]').forEach(im=>im.onclick=async()=>{const [pid,id]=im.dataset.big.split('|');let src=im.src;try{const s=await get(ref(db,'proj/photos/'+pid+'/'+id));if(s.val())src=s.val()}catch(e){}const w=window.open('');if(w)w.document.write('<title>Site photo</title><img src="'+src+'" style="max-width:100%">')});
 if($('regFile'))$('regFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const o=$('regOut');o.innerHTML='Reading…';try{REG=await readRegister(f);REGFILE=f.name;const S_=Object.values(REG.sites);
  REGHTML=(ROLE==='hr'&&!Object.keys(P.rates||{}).length?'<div class="banner">Tip: upload the supply rates first, so supply labour can be costed.</div>':'')+`<p><b>${REG.date?fmtD(REG.date)+' '+REG.date.slice(0,4):'No date found'}</b> · ${S_.length} sites · ${S_.reduce((s,x)=>s+x.present,0)} on site</p>${REG.warn.length?'<div class="banner">'+REG.warn.map(esc).join('<br>')+'</div>':''}<table><tr><th>Site</th><th class="r">Own present</th><th class="r">Own other status</th><th class="r">Supply</th><th class="r">Subcontract</th><th class="r">Total</th></tr>${S_.sort((a,b)=>b.present-a.present).map(x=>`<tr><td>${esc(x.site)}</td><td class="r">${x.ownPresent}</td><td class="r">${x.ownOther}</td><td class="r">${x.supPresent}</td><td class="r">${x.subPresent}</td><td class="r"><b>${x.present}</b></td></tr>`).join('')}</table>
  <div class="row" style="margin-top:10px"><label class="small">Date <input type="date" id="regDate" value="${REG.date}"></label><button class="btn p" id="regSave">Save this day${P.days&&P.days[REG.date]?' (replaces the earlier upload)':''}</button></div>`;o.innerHTML=REGHTML;wire()}catch(err){REGHTML='<span class="err">'+esc(err.message)+'</span>';o.innerHTML=REGHTML}e.target.value=''};
 if($('regSave'))$('regSave').onclick=async()=>{const d=$('regDate').value;if(!d){alert('Choose the date.');return}if(!REG)return;const v={_meta:{at:Date.now(),by:ME,file:String(REGFILE).slice(0,80),status:REG.stat||{}}};Object.values(REG.sites).forEach(x=>{const y=Object.assign({},x);delete y.costOwn;delete y.costSup;v[keyOf(x.site)]=y});
  try{await W.set('proj/days/'+d,v);await hist('Daily register '+d+' uploaded');REG=null;REGHTML='<span class="pill g">Saved</span> '+fmtD(d)+' '+d.slice(0,4);const o=$('regOut');if(o)o.innerHTML=REGHTML}catch(err){const o=$('regOut');if(o)o.innerHTML='<span class="err">'+esc(err.message)+'</span>'}};
 if($('lmM'))$('lmM').onchange=e=>{LM=e.target.value||today().slice(0,7);loadMonth(LM);draw()};
 if($('lmX'))$('lmX').onclick=()=>labourExcel(LM);
 if($('lmP'))$('lmP').onclick=()=>labourPDF(LM).catch(e=>alert(e.message));
 if($('tplBtn'))$('tplBtn').onclick=async()=>{const d=$('tplDate').value||today();const sm=m=>{TPLMSG=m;const x=$('tplMsg');if(x)x.textContent=m};sm('Preparing…');try{const r=await makeTemplate(d);sm(r.staff+' staff ('+r.leave+' on leave from the HR Portal), '+r.sup+' outside workers carried forward'+(r.from?' from '+fmtD(r.from):'')+'.')}catch(err){sm('Could not make the template: '+err.message)}};
 document.querySelectorAll('[data-sumx]').forEach(b=>b.onclick=()=>summaryExcel(b.dataset.sumx).catch(e=>alert(e.message)));
 document.querySelectorAll('[data-sump]').forEach(b=>b.onclick=()=>summaryPDF(b.dataset.sump).catch(e=>alert(e.message)));
 if($('rateFile'))$('rateFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const R=await readRates(f);if(!confirm('Replace the rates with '+Object.keys(R).length+' companies from this file?'))return;await W.set('proj/rates',R);await hist('Supply rates uploaded ('+Object.keys(R).length+' companies)');$('rateOut').textContent='Saved.'}catch(err){$('rateOut').textContent=err.message}e.target.value=''};
 if($('boardFile'))$('boardFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const B=await readBoard(f);const target=projList().find(([id,p])=>norm(p.site)===norm(B[0]&&B[0].site));if(!target)throw new Error('Add the project with site "'+(B[0]&&B[0].site)+'" first.');if(items(target[0]).length&&!confirm('This project already has priorities. Add these '+B.length+' as well?'))return;const up={};const now=Date.now();B.forEach(x=>{up['board/'+target[0]+'/'+uid()]={no:x.no,title:x.title,owner:x.owner,others:x.others,next:x.next,status:x.status,due:'',created:now,upd:now,by:ME}});await W.update('proj',up);await hist('Imported '+B.length+' priorities into '+target[1].name);$('boardOut').textContent=B.length+' priorities imported into '+target[1].name}catch(err){$('boardOut').textContent=err.message}e.target.value=''};
 if($('apSel'))$('apSel').onchange=async e=>{const k=e.target.value;if(!k)return;try{await W.update('proj/settings',{['financeApprover/'+k]:true,['finance/'+k]:true})}catch(err){alert(err.message)}};
 document.querySelectorAll('[data-unap]').forEach(b=>b.onclick=async()=>{try{await W.remove('proj/settings/financeApprover/'+b.dataset.unap)}catch(err){alert(err.message)}});
 document.querySelectorAll('[data-petty]').forEach(b=>b.onclick=async()=>{const pid=b.dataset.petty,d=$('pc_d_'+pid).value,a=+$('pc_a_'+pid).value,to=$('pc_t_'+pid).value.trim();if(!d||!(a>0)){alert('Enter the date and the amount.');return}if(d>today()){alert('The date cannot be in the future.');return}try{await W.push('proj/petty/'+pid,{date:d,amount:a,to:to.slice(0,80),by:ME,at:Date.now()});await hist('Petty cash '+aed(a)+' issued on '+d+' for '+P.projects[pid].name)}catch(err){alert(err.message)}});
 document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=async()=>{const [pid,mo]=b.dataset.confirm.split('|');if(!confirm('Confirm the figures as at '+asAtLbl(mo)+' for '+P.projects[pid].name+'?'))return;try{await W.update('proj/money/'+pid+'/'+mo,{confBy:ME,confAt:Date.now()});await hist('CFO confirmed money '+mo+' for '+P.projects[pid].name)}catch(err){alert(err.message)}});
 if($('tkSel'))$('tkSel').onchange=async e=>{const k=e.target.value;if(!k)return;try{await W.set('proj/settings/timekeepers/'+k,true)}catch(err){alert(err.message)}};
 document.querySelectorAll('[data-untk]').forEach(b=>b.onclick=async()=>{try{await W.remove('proj/settings/timekeepers/'+b.dataset.untk)}catch(err){alert(err.message)}});
 if($('finSel'))$('finSel').onchange=async e=>{const k=e.target.value;if(!k)return;try{await W.set('proj/settings/finance/'+k,true)}catch(err){alert(err.message)}};
 document.querySelectorAll('[data-unfin]').forEach(b=>b.onclick=async()=>{try{await W.remove('proj/settings/finance/'+b.dataset.unfin)}catch(err){alert(err.message)}});
 if($('saveSet'))$('saveSet').onclick=async()=>{try{await W.update('proj/settings',{divisor:+fv('divIn')||26,stdHours:+fv('stdIn')||8});$('setMsg').textContent='Saved.'}catch(err){$('setMsg').textContent=err.message}};
}
</script>
