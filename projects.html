<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CK Portal · Projects</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#1C3557;--gold:#C9A84C;--bg:#F4F6F9;--ink:#26303D;--muted:#6B7685;--line:#E3E7ED;--soft:#EEF2F7;--good:#2E8B6A;--warn:#C27C0E;--bad:#C0392B;--blue:#3E7CC4;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
.pbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;flex-wrap:wrap}
.pbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);margin-right:10px}.pbar .logo i{width:26px;height:26px;border-radius:7px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:700 11px Georgia;font-style:normal}
.mod{font:inherit;font-size:13.5px;border:none;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--ink)}.mod.on{background:var(--navy);color:#fff}
.pbar .user{margin-left:auto;font-size:12.5px;color:var(--muted)}.pbar .user b{color:var(--ink)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 47px)}
aside{background:var(--navy);color:#DCE4EF;padding:14px 10px;position:sticky;top:47px;height:calc(100vh - 47px);overflow:auto}
.grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8EA2BF;margin:12px 10px 4px}
.ni{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:8px;color:#C9D4E3;font-size:13.5px;cursor:pointer}.ni:hover{background:rgba(255,255,255,.08)}.ni.on{background:var(--gold);color:#1b1b1b;font-weight:600}
main{padding:20px 26px 50px;max-width:1260px;width:100%}
h1{font-size:22px;margin:0 0 4px;color:var(--navy)}.sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}.card h2{font-size:15.5px;margin:0 0 4px;color:var(--navy)}.note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}.tile{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:12px;padding:12px 14px}.tile .k{font-size:12px;color:var(--muted)}.tile .v{font:400 24px/1.2 Georgia,serif;color:var(--navy)}.tile .n{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr));gap:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--navy);background:var(--soft);font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}td.r,th.r{text-align:right}
.tw{overflow:auto;max-height:520px}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap}.g{background:#E5F4EE;color:var(--good)}.a{background:#FDF2DE;color:var(--warn)}.rd{background:#FBE7E5;color:var(--bad)}.nv{background:var(--soft);color:var(--navy)}
.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.gd{background:var(--gold);border-color:var(--gold);color:#1b1b1b}.btn.sm{font-size:12px;padding:3px 9px}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}textarea{width:100%;min-height:54px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.banner{background:#FFF8EA;border:1px solid #F0D9A6;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}.banner.i{background:#EEF2F7;border-color:#D6DEE8}
.modal{position:fixed;inset:0;background:rgba(23,35,56,.35);z-index:40;display:grid;place-items:center;padding:16px}.modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}.fg .full{grid-column:1/-1}.fg input,.fg select,.fg textarea{width:100%}
.pc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;border-left:5px solid var(--good)}.pc.a{border-left-color:var(--warn)}.pc.r{border-left-color:var(--bad)}.pc h3{margin:0 0 2px;color:var(--navy);font-size:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}.kv div{background:var(--soft);border-radius:8px;padding:6px 9px;font-size:12px;color:var(--muted)}.kv b{display:block;font-size:15px;color:var(--navy)}
.upd{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.upd img{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.mbar{height:14px;border-radius:7px;background:var(--soft);overflow:hidden;margin:3px 0 8px}.mbar i{display:block;height:100%}
.hide{display:none!important}.err{color:var(--bad);font-size:12.5px}.small{font-size:12px;color:var(--muted)}
#gate{display:grid;place-items:center;min-height:70vh}#gate .card{max-width:460px;text-align:center}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.fg{grid-template-columns:1fr}main{padding:16px 14px 40px}}
</style></head><body>
<div class="pbar"><span class="logo"><i>CK</i>CK Portal</span><button class="mod" id="toHR" title="Back to the HR Portal tab">HR</button><button class="mod on">Projects</button><span class="user" id="who">Checking your sign-in…</span></div>
<div id="gate"><div class="card"><h2 id="gateT">Opening Projects…</h2><p class="note" id="gateM">One moment.</p><div id="gateB"></div></div></div>
<div class="app hide" id="app"><aside><div class="grp">Projects</div><div id="nav"></div><div class="grp">Other modules</div><div class="ni" id="toHR2">🏠 HR Portal</div></aside><main id="main"></main></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, onValue, set as _set, update as _update, push as _push, remove as _remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { initializeAuth, browserSessionPersistence, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const FC={apiKey:"AIzaSyA_NToPyXvchX3XrApN937DpDcWOoJ7LTY",authDomain:"ck-hr-project.firebaseapp.com",databaseURL:"https://ck-hr-project-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ck-hr-project",storageBucket:"ck-hr-project.firebasestorage.app",messagingSenderId:"552309455585",appId:"1:552309455585:web:8e8ee62306cece974c15a0"};
const app=initializeApp(FC),db=getDatabase(app),auth=initializeAuth(app,{persistence:browserSessionPersistence});
const ADMINS={'dev@ckhr.internal':'Dev Mandrekar','darleendy@ckhr.internal':'Darleendy'};const CEO='cem@ckhr.internal';

// ── Safety lock: this module only ever writes inside proj/. HR Portal data is read-only here.
const okPath=p=>typeof p==='string'&&/^proj\//.test(p)&&!p.includes('..');
function guard(p){if(!okPath(p))throw new Error('Blocked: the Projects module only writes to proj/ ('+p+')');if(ROLE==='ceo')throw new Error('View only')}
const W={set:(p,v)=>{guard(p);return _set(ref(db,p),v)},update:(p,v)=>{if(p!=='proj')guard(p);if(ROLE==='ceo')throw new Error('View only');Object.keys(v).forEach(k=>guard(p+'/'+k));return _update(ref(db,p),v)},push:(p,v)=>{guard(p+'/x');return _push(ref(db,p),v)},remove:p=>{guard(p);return _remove(ref(db,p))}};
window.__projGuard=okPath;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ds(new Date());const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ds(d)};
const fmtD=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'';
const aed=v=>v==null||isNaN(v)?'—':'AED '+Math.round(v).toLocaleString('en-US');
const aedM=v=>v==null||isNaN(v)?'—':(Math.abs(v)>=1e6?'AED '+(v/1e6).toFixed(2)+' m':aed(v));
const tile=(k,v,n)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n||''}</div></div>`;
const keyOf=s=>String(s||'').trim().toLowerCase().replace(/[.#$\[\]\/]/g,' ').replace(/\s+/g,' ').trim().replace(/ /g,'_').slice(0,90)||'x';
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const toHR=()=>{try{if(window.opener&&!window.opener.closed){window.opener.focus();window.close();return}}catch(e){}location.href='./index.html'};$('toHR').onclick=toHR;$('toHR2').onclick=toHR;

let ROLE='',ME='',MYKEY='',PG='all',CUR='';
const P={settings:{},projects:{},board:{},days:{},updates:{},money:{},rates:{}};let EMP={};
function gate(t,m,b){$('gate').classList.remove('hide');$('app').classList.add('hide');$('gateT').textContent=t;$('gateM').textContent=m;$('gateB').innerHTML=b||''}
onAuthStateChanged(auth,async u=>{
 if(!u){$('who').textContent='Not signed in';gate('Sign in to Projects','Same username and password as the HR Portal.',`<div style="display:grid;gap:8px;text-align:left;margin-top:6px"><input id="lgU" placeholder="Username or company email" autocomplete="username"><input id="lgP" type="password" placeholder="Password" autocomplete="current-password"><button class="btn p" id="lgB">Sign in</button><span class="err" id="lgE"></span></div>`);
  const go=async()=>{const raw=$('lgU').value.trim().toLowerCase(),pw=$('lgP').value;if(!raw||!pw){$('lgE').textContent='Enter your username and password.';return}$('lgB').disabled=true;$('lgB').textContent='Signing in…';try{await signInWithEmailAndPassword(auth,raw.includes('@')?raw:raw+'@ckhr.internal',pw)}catch(e){$('lgE').textContent='Sign-in failed: please check the username and password.';$('lgB').disabled=false;$('lgB').textContent='Sign in'}};
  $('lgB').onclick=go;$('lgP').onkeydown=e=>{if(e.key==='Enter')go()};return}
 const em=(u.email||'').toLowerCase();
 if(ADMINS[em]){ROLE='hr';ME=ADMINS[em]}else if(em===CEO){ROLE='ceo';ME='Cem Kapancioglu'}
 else{let m=null;try{m=(await get(ref(db,'staffMap/'+u.uid))).val()}catch(e){}if(!m||m.enabled!==true){gate('No access','Your HR Portal access is not active. Please contact HR.');return}
  ROLE='staff';MYKEY=m.empKey;try{const v=(await get(ref(db,'staffView/'+m.empKey))).val()||{};ME=v.name||''}catch(e){}}
 $('who').innerHTML='Signed in · <b>'+esc(ME||em)+'</b> · '+({hr:'HR',ceo:'CEO (view)',staff:'Staff'}[ROLE]);listen()});
function listen(){const open=(p,k)=>onValue(ref(db,p),s=>{P[k]=s.val()||{};draw()},()=>{P[k]={};draw()});
 if(ROLE==='staff'){const subs=new Set();let finOn=false;const more=()=>{myProjects().forEach(pid=>{if(subs.has(pid))return;subs.add(pid);onValue(ref(db,'proj/board/'+pid),s=>{P.board[pid]=s.val()||{};draw()},()=>{});onValue(ref(db,'proj/updates/'+pid),s=>{P.updates[pid]=s.val()||{};draw()},()=>{})});
   if(isFin()&&!finOn){finOn=true;projList().forEach(([pid])=>onValue(ref(db,'proj/money/'+pid),s=>{P.money[pid]=s.val()||{};draw()},()=>{}))}};
  onValue(ref(db,'proj/settings'),s=>{P.settings=s.val()||{};more();draw()},()=>{});onValue(ref(db,'proj/projects'),s=>{P.projects=s.val()||{};more();draw()},()=>{draw()});return}
 open('proj/settings','settings');open('proj/projects','projects');
 ['board','days','updates','money','rates'].forEach(k=>open('proj/'+k,k));
 onValue(ref(db,'employees'),s=>{EMP=s.val()||{};draw()},()=>{EMP={}});}
const myProjects=()=>Object.entries(P.projects||{}).filter(([id,p])=>p&&p.team&&p.team[MYKEY]).map(([id])=>id);
const isFin=()=>!!(MYKEY&&P.settings&&P.settings.finance&&P.settings.finance[MYKEY]);
const S=()=>Object.assign({divisor:26,stdHours:8},P.settings||{});
const canAdmin=()=>ROLE==='hr';const canTeam=pid=>ROLE==='hr'||(ROLE==='staff'&&P.projects[pid]&&P.projects[pid].team&&P.projects[pid].team[MYKEY]);
const canMoney=()=>ROLE==='hr'||isFin();

// ── project figures
const projList=()=>Object.entries(P.projects||{}).filter(([id,p])=>p&&p.name).sort((a,b)=>(a[1].order||9)-(b[1].order||9)||String(a[1].name).localeCompare(b[1].name));
const dates=()=>Object.keys(P.days||{}).sort();
const lastDate=()=>dates().at(-1)||'';
const dayOf=(d,site)=>((P.days||{})[d]||{})[keyOf(site)]||null;
function weekSum(site,upTo,n){let man=0,cost=0,ds_=dates().filter(d=>d<=upTo).slice(-n);ds_.forEach(d=>{const x=dayOf(d,site);if(x){man+=x.present||0;cost+=(x.costOwn||0)+(x.costSup||0)}});return {man,cost,days:ds_.length}}
function monthSum(site,ym){let man=0,cost=0;dates().filter(d=>d.startsWith(ym)).forEach(d=>{const x=dayOf(d,site);if(x){man+=x.present||0;cost+=(x.costOwn||0)+(x.costSup||0)}});return {man,cost}}
const items=pid=>Object.entries((P.board||{})[pid]||{}).map(([id,x])=>Object.assign({id},x));
const isLate=x=>x.status!=='Done'&&x.due&&x.due<today();
const daysOpen=x=>x.created?Math.max(0,Math.round((Date.now()-x.created)/864e5)):null;
const lastUpd=pid=>Object.values((P.updates||{})[pid]||{}).sort((a,b)=>(b.at||0)-(a.at||0))[0]||null;
const latestMoney=pid=>{const m=(P.money||{})[pid]||{};const k=Object.keys(m).sort().at(-1);return k?Object.assign({month:k},m[k]):null};
function moneyCalc(m){if(!m)return null;const n=k=>+m[k]||0;const revised=n('contract')+n('voApproved')-n('omissions');return {revised,pending:n('voPending'),certified:n('certified'),received:n('received'),dueNow:n('dueNow'),overdue:n('overdue'),retention:n('retention'),future:Math.max(0,revised-n('certified')),toCollect:Math.max(0,revised-n('received')),committed:n('committed'),paid:n('paid'),supDue:n('supDue'),uncommitted:n('uncommitted'),toPay:Math.max(0,n('committed')-n('paid'))+n('uncommitted'),cashNow:n('received')-n('paid')}}
function flag(pid){const p=P.projects[pid];const I=items(pid);const late=I.filter(isLate).length,blk=I.filter(x=>x.status==='Blocked').length;const u=lastUpd(pid);const stale=!u||u.date<addD(today(),-2);const m=moneyCalc(latestMoney(pid));const cash=m&&m.cashNow<0;
 const lvl=(late>=3||blk>=2||cash)?'r':(late||blk||stale)?'a':'g';return {lvl,late,blk,stale,cash,u,m}}

// ── navigation
function nav(){const N=ROLE==='staff'?[['mine','📍 My projects'],...(isFin()?[['money','💰 Project money']]:[])]:[['all','🏗️ All projects'],...projList().map(([id,p])=>['p:'+id,'· '+p.name]),['register','📋 Daily register'],...(ROLE==='hr'?[['money','💰 Project money'],['rates','💲 Supply rates'],['setup','⚙️ Projects set-up']]:[['money','💰 Project money']])];
 if(!N.some(x=>x[0]===PG))PG=N[0][0];$('nav').innerHTML=N.map(([k,l])=>`<div class="ni ${k===PG?'on':''}" data-p="${esc(k)}">${esc(l)}</div>`).join('');
 $('nav').querySelectorAll('[data-p]').forEach(n=>n.onclick=()=>{PG=n.dataset.p;draw();window.scrollTo(0,0)})}
function draw(){if(!ROLE)return;$('gate').classList.add('hide');$('app').classList.remove('hide');nav();
 let h='';if(PG==='all')h=V.all();else if(PG.startsWith('p:')){CUR=PG.slice(2);h=V.project(CUR)}else h=(V[PG]||V.all)();$('main').innerHTML=h;wire()}
const RO=()=>ROLE==='ceo'?'<div class="banner i">View only.</div>':'';

// ── charts (SVG, no library)
function stackChart(site,n){const D=dates().slice(-n);if(!D.length)return '<p class="note">No daily register uploaded yet.</p>';const W=640,H=200,pad=34;const vals=D.map(d=>{const x=dayOf(d,site)||{};return [x.ownPresent||0,x.supPresent||0,x.subPresent||0]});const mx=Math.max(4,...vals.map(v=>v[0]+v[1]+v[2]));const bw=(W-pad-10)/D.length;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="People on site per day">`;[0,.5,1].forEach(f=>{const y=H-24-(H-44)*f;s+=`<line x1="${pad}" x2="${W-6}" y1="${y}" y2="${y}" stroke="#E3E7ED"/><text x="${pad-6}" y="${y+4}" font-size="11" text-anchor="end" fill="#6B7685">${Math.round(mx*f)}</text>`});
 D.forEach((d,i)=>{let y=H-24;const x=pad+i*bw+bw*.15,w=bw*.7;[['#1C3557',vals[i][0]],['#C9A84C',vals[i][1]],['#3E7CC4',vals[i][2]]].forEach(([c,v])=>{const h=(H-44)*v/mx;y-=h;if(v)s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" rx="2"><title>${fmtD(d)}: ${v}</title></rect>`});if(D.length<=16||i%2===0)s+=`<text x="${x+w/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="#6B7685">${fmtD(d).slice(0,6)}</text>`});
 return s+`</svg><div class="small"><span style="color:#1C3557">■</span> own staff &nbsp; <span style="color:#C9A84C">■</span> supply labour &nbsp; <span style="color:#3E7CC4">■</span> subcontract</div>`}
const mbar=(label,v,max,c,sub)=>`<div class="small" style="display:flex;justify-content:space-between"><span>${label}</span><b style="color:#26303D">${aedM(v)}</b></div><div class="mbar"><i style="width:${max>0?Math.max(0,Math.min(100,v/max*100)):0}%;background:${c}"></i></div>${sub?`<div class="small" style="margin:-6px 0 8px">${sub}</div>`:''}`;

const V={
all(){const L=projList();const d=lastDate();
 if(!L.length)return `<h1>All projects</h1>${canAdmin()?'<div class="banner">No projects yet. Open <b>Projects set-up</b> to add the pilot projects.</div>':'<p class="note">No projects yet.</p>'}`;
 return `<h1>All projects</h1><p class="sub">${d?'Latest daily register: <b>'+fmtD(d)+'</b>':'No daily register uploaded yet'} · progress, people, cost and money in one place.</p>${RO()}
 <div class="grid2">${L.map(([id,p])=>{const f=flag(id),x=d?dayOf(d,p.site):null,w=weekSum(p.site,d||today(),6),I=items(id);return `<div class="pc ${f.lvl==='g'?'':f.lvl}" data-open="${id}"><div class="row" style="margin:0"><h3 style="flex:1">${esc(p.name)}</h3><span class="pill ${f.lvl==='g'?'g':f.lvl==='a'?'a':'rd'}">${f.lvl==='g'?'On track':f.lvl==='a'?'Watch':'Action needed'}</span></div>
 <div class="small">PM: ${esc(empName(p.pm))} · Site manager: ${esc(empName(p.sm))}</div>

const xdate=v=>{if(v instanceof Date)return ds(v);if(typeof v==='number')return ds(new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5));const m=/(\d{4})-(\d{2})-(\d{2})/.exec(String(v||''));if(m)return m[0];const m2=/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/.exec(String(v||''));return m2?m2[3]+'-'+m2[2].padStart(2,'0')+'-'+m2[1].padStart(2,'0'):''};
function rateFor(company,trade){const R=P.rates||{};const cn=norm(company);if(!cn)return null;let c=Object.values(R).find(x=>norm(x.name)===cn||(x.aliases||[]).some(a=>norm(a)===cn));if(!c)c=Object.values(R).find(x=>[x.name,...(x.aliases||[])].some(a=>{const n=norm(a);return n&&(n.includes(cn)||cn.includes(n.split(' ').slice(0,2).join(' ')))}));
 if(!c)return {missing:'company'};if(/contract/i.test(c.basis||'')||!c.trades||!Object.keys(c.trades).length)return {contract:true,c};const tn=norm(trade);let r=Object.entries(c.trades).find(([t])=>norm(t)===tn);if(!r)r=Object.entries(c.trades).find(([t])=>/skilled worker/i.test(t)&&!/semi|un/i.test(t));if(!r)r=Object.entries(c.trades).sort((a,b)=>b[1]-a[1])[0];return {rate:+r[1],basis:c.basis,c,trade:r[0]}}
async function readRegister(file){const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const sv=n=>{const k=wb.SheetNames.find(s=>s.toLowerCase().startsWith(n));return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,raw:true,defval:''}):null};

 const hi=hdrIdx(st,['emp id','name','site','status']);if(hi<0)throw new Error('Could not find the header row in the Staff tab.');const H=st[hi];const c={id:col(H,'emp id'),name:col(H,'name'),des:col(H,'designation'),cat:col(H,'category'),site:col(H,'site'),st:col(H,'status'),hrs:col(H,'hours'),ot:col(H,'overtime')};
 const byId={};Object.entries(EMP).forEach(([k,e])=>{if(e&&e.empId)byId[String(e.empId).trim().toUpperCase()]=e});const s=S();
 const sites={},warn=[];const add=site=>sites[site]=sites[site]||{site,ownPresent:0,ownOther:0,supPresent:0,subPresent:0,present:0,costOwn:0,costSup:0,ot:0,trades:{},people:[]};
 let noStatus=0,noMatch=0,noSite=0;st.slice(hi+1).forEach(r=>{const name=String(r[c.name]||'').trim();if(!name)return;const site=String(r[c.site]||'').trim(),status=String(r[c.st]||'').trim();if(!status){noStatus++;return}if(!site){if(PRESENT(status))noSite++;return}const S_=add(site);const des=(String(r[c.des]||'').trim()||'Staff').replace(/[.#$\[\]\/]/g,'-').slice(0,60);
  if(PRESENT(status)){S_.ownPresent++;S_.present++;const hrs=+r[c.hrs];const f=hrs>0&&hrs<=16?hrs/s.stdHours:1;const e=byId[String(r[c.id]||'').trim().toUpperCase()];if(e){S_.costOwn+=(+String(e.grossSalary||0).replace(/,/g,'')||0)/s.divisor*f}else noMatch++;
   S_.ot+=+r[c.ot]||0;(S_.trades[des]=S_.trades[des]||{own:0,sup:0,sub:0}).own++}else S_.ownOther++;S_.people.push({n:name,t:des,s:status,src:'own'})});
 let supN=0,noRate=new Set();if(su){const hs=hdrIdx(su,['name','company','site']);if(hs>=0){const H2=su[hs];const d={name:col(H2,'name'),des:col(H2,'designation'),co:col(H2,'company'),type:col(H2,'type'),site:col(H2,'site'),pa:col(H2,'present'),hrs:col(H2,'hours'),ot:col(H2,'overtime')};
  su.slice(hs+1).forEach(r=>{const name=String(r[d.name]||'').trim();if(!name)return;const site=String(r[d.site]||'').trim(),pa=String(r[d.pa]||'').trim();if(!site||!PRESENT(pa))return;const S_=add(site);const des=(String(r[d.des]||'').trim()||'Worker').replace(/[.#$\[\]\/]/g,'-').slice(0,60),type=String(r[d.type]||'').trim(),co=String(r[d.co]||'').trim();supN++;
   const sub=/sub/i.test(type);if(sub)S_.subPresent++;else S_.supPresent++;S_.present++;(S_.trades[des]=S_.trades[des]||{own:0,sup:0,sub:0})[sub?'sub':'sup']++;

 if(noStatus)warn.push(noStatus+' own staff without a status (not counted)');if(noSite)warn.push(noSite+' own staff marked Present but without a site (not counted)');if(noMatch)warn.push(noMatch+' present staff not found in the HR Portal by Emp ID (no cost)');if(noRate.size)warn.push('No rate for: '+[...noRate].join(', ')+' (no cost)');
 return {date,sites,warn,supN}}
async function readRates(file){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const k=wb.SheetNames.find(s=>/compan/i.test(s));if(!k)throw new Error('Tab "Companies" not found.');const rows=XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,raw:true,defval:''});
 const hi=hdrIdx(rows,['no','name as seen']);if(hi<0)throw new Error('Header row not found.');const out={};let cur=null;
 rows.slice(hi+1).forEach(r=>{const no=r[0],seen=String(r[1]||'').trim(),correct=String(r[2]||'').trim();if(no!==''&&seen){const name=correct||seen.split('/')[0].trim();cur={name,aliases:seen.split('/').map(x=>x.trim()).filter(Boolean),type:String(r[3]||'').trim(),basis:String(r[4]||'').trim(),trades:{}};if(r[5]!==''&&!isNaN(+r[5]))cur.trades['Skilled Worker']=+r[5];out[keyOf(name)]=cur}else if(cur&&seen&&r[5]!==''&&!isNaN(+r[5])){cur.trades[seen.replace(/[.#$\[\]\/]/g,' ').trim()]=+r[5]}});
 return out}
async function readBoard(file){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});const hi=hdrIdx(rows,['project','no','priority']);if(hi<0)throw new Error('Not the board file (columns Project, No, Priority).');const H=rows[hi];
 const c={pr:col(H,'project'),no:col(H,'no'),t:col(H,'priority'),o:col(H,'ck owner'),oth:col(H,'others'),nx:col(H,'next'),st:col(H,'status')};return rows.slice(hi+1).filter(r=>String(r[c.t]||'').trim()).map(r=>({site:String(r[c.pr]||'').trim(),no:+r[c.no]||0,title:String(r[c.t]).trim().slice(0,200),owner:String(r[c.o]||'').trim(),others:String(r[c.oth]||'').trim(),next:String(r[c.nx]||'').trim(),status:/done/i.test(r[c.st])?'Done':/block/i.test(r[c.st])?'Blocked':'Open'}))}
async function photoData(file){const img=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)});const mx=1000,sc=Math.min(1,mx/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.72,u=c.toDataURL('image/jpeg',q);while(u.length>300000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}return u}
async function hist(what){try{await W.push('proj/history',{at:Date.now(),by:ME,what:String(what).slice(0,300)})}catch(e){}}

// ── forms
function modal(html,onSave){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box">${html}<div class="row" style="margin-top:14px"><button class="btn p" id="mSave">Save</button><button class="btn" id="mCancel">Cancel</button><span style="flex:1"></span><span id="mDel"></span><span class="err" id="mErr"></span></div></div>`;document.body.appendChild(m);$('mCancel').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};$('mSave').onclick=async()=>{try{$('mErr').textContent='';$('mSave').disabled=true;const r=await onSave();if(r!==false)m.remove();else $('mSave').disabled=false}catch(e){$('mErr').textContent=e.message||String(e);$('mSave').disabled=false}};return m}
const fv=id=>{const x=$(id);return x?String(x.value).trim():''};
function itemForm(pid,iid){const x=iid?((P.board[pid]||{})[iid]||{}):{status:'Open'};modal(`<h2>${iid?'Update':'New'} priority · ${esc(P.projects[pid].name)}</h2><div class="fg"><div class="full"><label>Priority *</label><input id="iT" value="${esc(x.title||'')}"></div><div><label>CK owner(s)</label><input id="iO" value="${esc(x.owner||'')}"></div><div><label>Others involved</label><input id="iOt" value="${esc(x.others||'')}"></div><div class="full"><label>Next step</label><input id="iN" value="${esc(x.next||'')}"></div><div><label>Due date</label><input id="iD" type="date" value="${esc(x.due||'')}"></div><div><label>Status</label><select id="iS">${['Open','In progress','Blocked','Done'].map(s=>`<option${s===(x.status||'Open')?' selected':''}>${s}</option>`).join('')}</select></div><div class="full"><label>Note (e.g. what it is blocked by)</label><input id="iNt" value="${esc(x.note||'')}"></div></div>`,
 async()=>{const t=fv('iT');if(!t)throw new Error('Enter the priority.');const k=iid||uid();await W.set('proj/board/'+pid+'/'+k,{no:x.no||items(pid).length+1,title:t,owner:fv('iO'),others:fv('iOt'),next:fv('iN'),due:fv('iD'),status:fv('iS'),note:fv('iNt'),created:x.created||Date.now(),upd:Date.now(),by:ME});await hist((iid?'Updated':'Added')+' priority on '+P.projects[pid].name+': '+t+' ('+fv('iS')+')')});
 if(iid&&canAdmin()){$('mDel').innerHTML='<button class="btn" id="mD" style="color:#C0392B">Delete</button>';$('mD').onclick=async()=>{if(confirm('Delete this priority?')){await W.remove('proj/board/'+pid+'/'+iid);document.querySelector('.modal').remove()}}}}
function updForm(pid){let ph=null;modal(`<h2>Today's site update · ${esc(P.projects[pid].name)}</h2><div class="fg"><div class="full"><label>Photo of today's work</label><input type="file" id="uP" accept="image/*" capture="environment"><div class="small" id="uPm"></div></div><div class="full"><label>Done today *</label><textarea id="uD" maxlength="400"></textarea></div><div class="full"><label>Blocked by (if anything)</label><textarea id="uB" maxlength="300"></textarea></div><div class="full"><label>Tomorrow *</label><textarea id="uT" maxlength="300"></textarea></div><div><label>Date</label><input type="date" id="uDt" value="${today()}"></div></div>`,
 async()=>{const d=fv('uD'),t=fv('uT');if(!d||!t)throw new Error('Fill "Done today" and "Tomorrow".');await W.push('proj/updates/'+pid,{date:fv('uDt')||today(),at:Date.now(),byKey:MYKEY||'',byName:ME,done:d,blocked:fv('uB'),tomorrow:t,...(ph?{photo:ph}:{})});await hist('Site update on '+P.projects[pid].name)});
 $('uP').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('uPm').textContent='Preparing the photo…';try{ph=await photoData(f);$('uPm').textContent='Photo ready ('+Math.round(ph.length/1024)+' KB).'}catch(err){ph=null;$('uPm').textContent='Could not read the photo.'}}}
function moneyForm(pid){const lm=latestMoney(pid)||{};const F=[['contract','Original contract value'],['voApproved','Approved additions (variations)'],['omissions','Approved omissions'],['voPending','Variations pending approval'],['certified','Certified to date'],['received','Received to date'],['dueNow','Due now (certified, not yet received, within terms)'],['overdue','Overdue from the client'],['retention','Retention held by the client'],['committed','Supplier and subcontract commitments (orders)'],['paid','Paid to suppliers and subcontractors'],['supDue','Due now / overdue to suppliers'],['uncommitted','Cost to complete not yet committed']];const ym=today().slice(0,7);
 modal(`<h2>Money figures · ${esc(P.projects[pid].name)}</h2><p class="note">AED, totals to date. From Tally and the project files. Saved per month; the latest month is shown to Mr. Cem.</p><div class="fg"><div><label>Month</label><input type="month" id="mM" value="${ym}"></div><div></div>${F.map(([k,l])=>`<div><label>${l}</label><input type="number" step="any" id="m_${k}" value="${lm[k]??''}"></div>`).join('')}<div class="full"><label>Note</label><input id="mNote" value="${esc(lm.note||'')}"></div></div>`,
 async()=>{const mo=fv('mM');if(!/^\d{4}-\d{2}$/.test(mo))throw new Error('Choose the month.');const o={at:Date.now(),by:ME,note:fv('mNote')};F.forEach(([k])=>{const v=fv('m_'+k);o[k]=v===''?0:+v;if(isNaN(o[k]))throw new Error('Numbers only.')});await W.set('proj/money/'+pid+'/'+mo,o);await hist('Money figures '+mo+' for '+P.projects[pid].name)})}
function projForm(pid){const p=pid?P.projects[pid]:{team:{}};const sites=[...new Set(dates().flatMap(d=>Object.values(P.days[d]||{}).map(x=>x.site).filter(Boolean)))].sort();
 modal(`<h2>${pid?'Edit':'New'} project</h2><div class="fg"><div class="full"><label>Project name *</label><input id="pN" value="${esc(p.name||'')}"></div><div class="full"><label>Site name exactly as in the daily register *</label><input id="pS" list="pSl" value="${esc(p.site||'')}"><datalist id="pSl">${sites.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div><div><label>Project manager</label><select id="pPm"><option value="">—</option>${empOpts(p.pm)}</select></div><div><label>Site manager</label><select id="pSm"><option value="">—</option>${empOpts(p.sm)}</select></div><div class="full"><label>Others in the team (can update priorities and send site updates)</label><select id="pT" multiple size="6">${empOpts('')}</select><div class="small">Ctrl + click to choose several. Current: ${Object.keys(p.team||{}).map(empName).map(esc).join(', ')||'—'}</div></div><div><label>Order on the page</label><input id="pO" type="number" value="${p.order||1}"></div></div>`,
 async()=>{const n=fv('pN'),s=fv('pS');if(!n||!s)throw new Error('Enter the project name and its site.');const team={};const pm=fv('pPm'),sm=fv('pSm');if(pm)team[pm]=true;if(sm)team[sm]=true;[...$('pT').selectedOptions].forEach(o=>team[o.value]=true);if(pid)Object.keys(p.team||{}).forEach(k=>{if(![...$('pT').options].some(o=>o.value===k&&!o.selected)||k===pm||k===sm)team[k]=true});
  const k=pid||uid();await W.set('proj/projects/'+k,{name:n,site:s,pm,sm,team,order:+fv('pO')||1,upd:Date.now(),by:ME});await hist((pid?'Edited':'Added')+' project '+n)});
 if(pid){$('mDel').innerHTML='<button class="btn" id="mD" style="color:#C0392B">Delete</button>';$('mD').onclick=async()=>{if(confirm('Delete this project (its priorities, updates and money figures stay stored)?')){await W.remove('proj/projects/'+pid);document.querySelector('.modal').remove()}}}}

// ── events
let REG=null;
function wire(){
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{PG='p:'+b.dataset.open;draw();window.scrollTo(0,0)});
 document.querySelectorAll('[data-additem]').forEach(b=>b.onclick=()=>itemForm(b.dataset.additem,''));
 document.querySelectorAll('[data-edititem]').forEach(b=>b.onclick=()=>{const [p,i]=b.dataset.edititem.split('|');itemForm(p,i)});
 document.querySelectorAll('[data-newupd]').forEach(b=>b.onclick=()=>updForm(b.dataset.newupd));
 document.querySelectorAll('[data-money]').forEach(b=>b.onclick=()=>moneyForm(b.dataset.money));
 document.querySelectorAll('[data-editproj]').forEach(b=>b.onclick=()=>projForm(b.dataset.editproj));
 document.querySelectorAll('[data-big]').forEach(im=>im.onclick=()=>{const w=window.open('');if(w)w.document.write('<title>Site photo</title><img src="'+im.src+'" style="max-width:100%">')});
 if($('regFile'))$('regFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const o=$('regOut');o.innerHTML='Reading…';try{if(!Object.keys(P.rates||{}).length)o.innerHTML='<div class="banner">Tip: upload the supply rates first, so supply labour can be costed.</div>';REG=await readRegister(f);const S_=Object.values(REG.sites);
  o.innerHTML=(o.innerHTML.includes('Tip')?o.innerHTML:'')+`<p><b>${REG.date?fmtD(REG.date)+' '+REG.date.slice(0,4):'No date found'}</b> · ${S_.length} sites · ${S_.reduce((s,x)=>s+x.present,0)} on site · labour cost ${aed(S_.reduce((s,x)=>s+x.costOwn+x.costSup,0))}</p>${REG.warn.length?'<div class="banner">'+REG.warn.map(esc).join('<br>')+'</div>':''}<table><tr><th>Site</th><th class="r">Own present</th><th class="r">Own other status</th><th class="r">Supply</th><th class="r">Subcontract</th><th class="r">Cost</th></tr>${S_.sort((a,b)=>b.present-a.present).map(x=>`<tr><td>${esc(x.site)}</td><td class="r">${x.ownPresent}</td><td class="r">${x.ownOther}</td><td class="r">${x.supPresent}</td><td class="r">${x.subPresent}</td><td class="r">${aed(x.costOwn+x.costSup)}</td></tr>`).join('')}</table>
  <div class="row" style="margin-top:10px"><label class="small">Date <input type="date" id="regDate" value="${REG.date}"></label><button class="btn p" id="regSave">Save this day${P.days&&P.days[REG.date]?' (replaces the earlier upload)':''}</button></div>`;
  $('regSave').onclick=async()=>{const d=$('regDate').value;if(!d){alert('Choose the date.');return}const v={_meta:{at:Date.now(),by:ME,file:f.name.slice(0,80)}};Object.values(REG.sites).forEach(x=>{v[keyOf(x.site)]=x});try{await W.set('proj/days/'+d,v);await hist('Daily register '+d+' uploaded');o.innerHTML='<span class="pill g">Saved</span> '+fmtD(d)}catch(err){o.innerHTML='<span class="err">'+esc(err.message)+'</span>'}}}catch(err){o.innerHTML='<span class="err">'+esc(err.message)+'</span>'}e.target.value=''};
 if($('rateFile'))$('rateFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const R=await readRates(f);if(!confirm('Replace the rates with '+Object.keys(R).length+' companies from this file?'))return;await W.set('proj/rates',R);await hist('Supply rates uploaded ('+Object.keys(R).length+' companies)');$('rateOut').textContent='Saved.'}catch(err){$('rateOut').textContent=err.message}e.target.value=''};
 if($('boardFile'))$('boardFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const B=await readBoard(f);const target=projList().find(([id,p])=>norm(p.site)===norm(B[0]&&B[0].site));if(!target)throw new Error('Add the project with site "'+(B[0]&&B[0].site)+'" first.');if(items(target[0]).length&&!confirm('This project already has priorities. Add these '+B.length+' as well?'))return;const up={};const now=Date.now();B.forEach(x=>{up['board/'+target[0]+'/'+uid()]={no:x.no,title:x.title,owner:x.owner,others:x.others,next:x.next,status:x.status,due:'',created:now,upd:now,by:ME}});await W.update('proj',up);await hist('Imported '+B.length+' priorities into '+target[1].name);$('boardOut').textContent=B.length+' priorities imported into '+target[1].name}catch(err){$('boardOut').textContent=err.message}e.target.value=''};
 if($('finSel'))$('finSel').onchange=async e=>{const k=e.target.value;if(!k)return;try{await W.set('proj/settings/finance/'+k,true)}catch(err){alert(err.message)}};
 document.querySelectorAll('[data-unfin]').forEach(b=>b.onclick=async()=>{try{await W.remove('proj/settings/finance/'+b.dataset.unfin)}catch(err){alert(err.message)}});
 if($('saveSet'))$('saveSet').onclick=async()=>{try{await W.update('proj/settings',{divisor:+fv('divIn')||26,stdHours:+fv('stdIn')||8});$('setMsg').textContent='Saved.'}catch(err){$('setMsg').textContent=err.message}};
}
</script>
