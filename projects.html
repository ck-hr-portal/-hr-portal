const WIN=()=>addD(today(),-62);const recent=p=>query(ref(db,p),orderByKey(),startAt(WIN()));const lastN=(p,n)=>query(ref(db,p),orderByKey(),limitToLast(n));

 const idOf={};Object.entries(EMP).forEach(([k,e])=>{if(e&&e.empId)idOf[k]=String(e.empId).trim().toUpperCase()});const daysBy={};dates().filter(x=>x.startsWith(ym)).forEach(d=>Object.values(P.days[d]||{}).forEach(x=>{if(!x||!x.site)return;(x.people||[]).forEach(p=>{if(p.src==='own'&&p.id&&PRESENT(p.s)){const id=String(p.id).toUpperCase();(daysBy[id]=daysBy[id]||{})[x.site]=((daysBy[id]||{})[x.site]||0)+1}})}));

 const r={site:{},unalloc:0,byCat:{}};[...Object.values(CE||{}),...proAsCE].forEach(c=>{if(!c)return;const m0=c.month||c.from;if(!/^\d{4}-\d{2}$/.test(String(m0||'')))return;const N=c.spread||spreadMonths(c.cat);const k=mDiff(m0,ym);if(k<0||k>=N)return;const a=num(c.amount)/N;if(!(a>0))return;const id=idOf[c.target];const ds=id&&daysBy[id];r.byCat[c.cat||'Other']=(r.byCat[c.cat||'Other']||0)+a;if(!ds){r.unalloc+=a;return}const tot=Object.values(ds).reduce((s,v)=>s+v,0);Object.entries(ds).forEach(([s,v])=>r.site[s]=(r.site[s]||0)+a*v/tot)});

const costOf=(d,site)=>{const c=((P.cost||{})[d]||{})[keyOf(site)];if(c)return (c.own||0)+(c.sup||0);const x=dayOf(d,site);return x?(x.costOwn||0)+(x.costSup||0):0};

labour(){if(!LMload[LM])setTimeout(()=>loadMonth(LM),0);const {D,rows,pilot,VA}=labourRows(LM);const T=k=>rows.reduce((s,r)=>s+r[k],0);const OC=ohCanSee()&&D.length?ohCalc(LM):null;const PS=OC?OC.projSite:null;const prr=r=>PS&&!ohOfficeSite(r.site)?(PS[r.site]||0):0;const OS=OH.on&&OC?OC.share(OH.basis):null;const shr=r=>OS?(OS[r.site]||0):0;

overhead(){if(!ohCanSee())return '<p class="note">Not available.</p>';if(!LMload[OHM])setTimeout(()=>loadMonth(OHM),0);const c=ohCalc(OHM),mL=new Date(OHM+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});

 return head+`<p class="note">Period: ${fmtD(c.from)} to ${fmtD(c.to)} ${c.to.slice(0,4)} (${c.pd} of ${c.md} days, from the daily registers). Sites with "office" in their name count as office, not as a project site.</p>

 <div class="card"><h2>Project staff by department · charged to projects</h2><p class="note">How each person is charged: <span class="pill nv">timesheet</span> % of their week per site from their weekly timesheet (first, where filled in) · <span class="pill g">team</span> PM, site manager or team member of a project (in Projects set-up) goes to that project, split equally if in several · <span class="pill a">shared</span> everyone else is shared across sites by their department's basis (set in Projects set-up). Click a department to see its people.</p>${grp(c.proj,'p:',true)||'<p class="note">No project staff. Set department types in ⚙️ Projects set-up.</p>'}

 ${(()=>{const L=Object.entries(EMP).filter(([k,e])=>e&&e.name&&e.status!=='Inactive'&&tsDeptOn(e.dept));if(!L.length)return '';const tw=monOf(today()),lw=addD(tw,-7),T=P.time||{},mk=(k,w)=>T[k]&&T[k][w]?'<span class="pill g">✓ filled</span>':'<span class="pill a">not yet</span>';

 <div class="card"><h2>Company overhead by department</h2><p class="note">Shown on projects as a separate "company overhead" amount; untick "Include company overhead" to see projects without it.</p>${grp(c.office,'d:',false)||'<p class="note">No company overhead.</p>'}
 <div style="display:flex;justify-content:space-between;padding-top:8px;font-weight:700;color:var(--navy)"><span>Total company overhead</span><span>${aed(c.offT)}</span></div></div>

 document.querySelectorAll('[data-upfile]').forEach(inp=>inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;const [kind,pid]=inp.dataset.upfile.split('|');try{const wb=await readBook(f);const K=fileKind(wb);if(!K.has(kind)){const other=['soa','cboq','register'].find(k=>K.has(k));if(other){UPX=null;inp.value='';alert('Wrong place: '+WRONGPLACE[other]);draw();return}}UPX={kind,pid,file:f.name,data:kind==='cboq'?readClientBoq(wb):readSOA(wb)}}catch(err){UPX=null;inp.value='';alert(err.message+(kind==='cboq'?' Is this the client BOQ? The internal BOQ (procurement tracker) goes in the internal BOQ box below; Finance\'s SOA goes in the "Money and SOA" tab.':' Is this Finance\'s statement of account? Client and internal BOQs go in the "Cost plan (BOQs)" tab.'))}draw()});

 document.querySelectorAll('[data-sp]').forEach(i=>i.onchange=async()=>{const s=i.dataset.sp,raw=String(i.value).trim();if(raw===''){try{await W.remove('proj/settings/sitePct/'+keyOf(s))}catch(err){alert(err.message)}return}const v=+raw;if(!(v>=0&&v<=100)){alert('Type a % between 0 and 100, or leave it empty for an equal share.');i.value=sitePct(s)==null?'':sitePct(s);return}
  const other=[...document.querySelectorAll('[data-sp]')].filter(x=>x!==i).reduce((a,x)=>a+(String(x.value).trim()===''?0:+x.value||0),0);if(other+v>100){alert('The fixed shares would add up to '+(other+v)+'%. They must not be more than 100%.');i.value=sitePct(s)==null?'':sitePct(s);return}
  try{await W.set('proj/settings/sitePct/'+keyOf(s),v)}catch(err){alert(err.message)}});
 if($('phM'))$('phM').onchange=e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){PHM=e.target.value;draw()}};
 document.querySelectorAll('[data-ack]').forEach(b=>b.onclick=()=>{const [pid,id]=b.dataset.ack.split('|');const c=projChecks(pid).find(x=>x.id===id);if(!c)return;const prev=ackRec(pid,id);
  modal(`<h2>Mark as checked</h2><p class="note"><b>${esc(c.title)}</b><br>${esc(c.detail)}</p><div class="fg"><div class="full"><label>Outcome *</label><select id="akO"><option value="">— choose —</option>${OUTCOMES.map(o=>`<option>${esc(o)}</option>`).join('')}</select></div><div class="full"><label>Reason / what was checked or corrected * (kept with the project, so anyone can see later why)</label><textarea id="akN" maxlength="1000" placeholder="e.g. Contract value in the SOA corrected to AED 11,428,237.81 excl. VAT; SOA re-uploaded on 18 Nov. Or: difference is VO-07 approved on 10 Nov, not yet in the client BOQ."></textarea></div></div>`,
  async()=>{const o=fv('akO'),n=fv('akN');if(!o)throw new Error('Choose the outcome.');if(n.length<10)throw new Error('Please write the reason (at least a short sentence), so it is clear later why this was accepted or what was corrected.');
   const log=Object.assign({},(prev&&prev.log)||{});if(prev)log['e'+(prev.at||Date.now())]={by:prev.by||'',at:prev.at||0,outcome:prev.outcome||'',note:prev.note||'',...(prev.reopened?{reopened:true}:{})};
   await W.set('proj/checks/'+pid+'/'+id,{by:ME,at:Date.now(),outcome:o,note:n.slice(0,1000),title:c.title.slice(0,200),log});await hist('Figure check on '+P.projects[pid].name+' · '+c.title+' · '+o+' · '+n.slice(0,200))})});
 document.querySelectorAll('[data-unack]').forEach(b=>b.onclick=()=>{const [pid,id]=b.dataset.unack.split('|');const prev=ackRec(pid,id);
  modal(`<h2>Reopen this check</h2><div class="fg"><div class="full"><label>Why is it reopened? *</label><textarea id="akR" maxlength="500"></textarea></div></div>`,async()=>{const n=fv('akR');if(n.length<5)throw new Error('Please write why it is reopened.');
   const log=Object.assign({},(prev&&prev.log)||{});if(prev)log['e'+(prev.at||Date.now())]={by:prev.by||'',at:prev.at||0,outcome:prev.outcome||'',note:prev.note||''};
   await W.set('proj/checks/'+pid+'/'+id,{by:ME,at:Date.now(),reopened:true,note:n.slice(0,500),title:(prev&&prev.title)||'',log});await hist('Figure check reopened on '+P.projects[pid].name+': '+n.slice(0,200))})});
