<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CK Portal · Performance</title>
<style>
:root{--navy:#1C3557;--gold:#C9A84C;--bg:#F4F6F9;--ink:#26303D;--muted:#6B7685;--line:#E3E7ED;--soft:#EEF2F7;--good:#2E8B6A;--warn:#C27C0E;--bad:#C0392B;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
.pbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;flex-wrap:wrap}
.pbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);margin-right:10px}.pbar .logo i{width:26px;height:26px;border-radius:7px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:700 11px Georgia;font-style:normal}
.mod{font:inherit;font-size:13.5px;border:none;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--ink)}.mod.on{background:var(--navy);color:#fff}
.pbar .user{margin-left:auto;font-size:12.5px;color:var(--muted)}.pbar .user b{color:var(--ink)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 47px)}
aside{background:var(--navy);color:#DCE4EF;padding:14px 10px;position:sticky;top:47px;height:calc(100vh - 47px);overflow:auto}
.grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8EA2BF;margin:12px 10px 4px}
.ni{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:8px;color:#C9D4E3;font-size:13.5px;cursor:pointer}.ni:hover{background:rgba(255,255,255,.08)}.ni.on{background:var(--gold);color:#1b1b1b;font-weight:600}
main{padding:20px 26px 50px;max-width:1260px;width:100%}
h1{font-size:22px;margin:0 0 4px;color:var(--navy)}.sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}.card h2{font-size:15.5px;margin:0 0 4px;color:var(--navy)}.note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}.tile{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:12px;padding:12px 14px}.tile .k{font-size:12px;color:var(--muted)}.tile .v{font:400 26px/1.2 Georgia,serif;color:var(--navy)}.tile .n{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--navy);background:var(--soft);font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}td.r,th.r{text-align:right}
.tw{overflow:auto;max-height:560px}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap}.g{background:#E5F4EE;color:var(--good)}.a{background:#FDF2DE;color:var(--warn)}.rd{background:#FBE7E5;color:var(--bad)}.nv{background:var(--soft);color:var(--navy)}
.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.gd{background:var(--gold);border-color:var(--gold);color:#1b1b1b}.btn.sm{font-size:12px;padding:3px 9px}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}textarea{width:100%;min-height:60px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.banner{background:#FFF8EA;border:1px solid #F0D9A6;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}.banner.i{background:#EEF2F7;border-color:#D6DEE8}
.modal{position:fixed;inset:0;background:rgba(23,35,56,.35);z-index:40;display:grid;place-items:center;padding:16px}.modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}.fg .full{grid-column:1/-1}.fg input,.fg select,.fg textarea{width:100%}
.sc{display:inline-block;min-width:38px;text-align:center;padding:1px 8px;border-radius:7px;font-weight:700}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;min-width:80px}.bar i{display:block;height:100%}
.hide{display:none!important}.err{color:var(--bad);font-size:12.5px}
#gate{display:grid;place-items:center;min-height:70vh}#gate .card{max-width:460px;text-align:center}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.fg{grid-template-columns:1fr}}
</style></head><body>
<div class="pbar"><span class="logo"><i>CK</i>CK Portal</span><button class="mod" id="toHR">HR</button><button class="mod on">Performance</button><span class="user" id="who">Checking your sign-in…</span></div>
<div id="gate"><div class="card"><h2 id="gateT">Opening Performance…</h2><p class="note" id="gateM">One moment.</p><p id="gateB"></p></div></div>
<div class="app hide" id="app"><aside><div class="grp">Performance</div><div id="nav"></div><div class="grp">Other modules</div><div class="ni" id="toHR2">🏠 HR Portal</div></aside><main id="main"></main></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, onValue, set as _set, update as _update, push as _push, remove as _remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { initializeAuth, browserSessionPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// Same project, same login as the HR Portal (session kept in this browser tab).
const FC={apiKey:"AIzaSyA_NToPyXvchX3XrApN937DpDcWOoJ7LTY",authDomain:"ck-hr-project.firebaseapp.com",databaseURL:"https://ck-hr-project-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ck-hr-project",storageBucket:"ck-hr-project.firebasestorage.app",messagingSenderId:"552309455585",appId:"1:552309455585:web:8e8ee62306cece974c15a0"};
const app=initializeApp(FC),db=getDatabase(app),auth=initializeAuth(app,{persistence:browserSessionPersistence});
const ADMINS={'dev@ckhr.internal':'Dev Mandrekar','darleendy@ckhr.internal':'Darleendy'};
const CEO='cem@ckhr.internal';

// ── Safety lock: this module may only ever write inside perf/. Everything else is read-only.
const okPath=p=>typeof p==='string'&&/^perf\//.test(p)&&!p.includes('..');
function guard(p){if(!okPath(p))throw new Error('Blocked: the Performance module only writes to perf/ ('+p+')');if(ROLE==='ceo')throw new Error('View only');}
const W={
 set:(p,v)=>{guard(p);return _set(ref(db,p),v)},
 update:(p,v)=>{if(p!=='perf')guard(p);if(ROLE==='ceo')throw new Error('View only');Object.keys(v).forEach(k=>guard(p+'/'+k));return _update(ref(db,p),v)},
 push:(p,v)=>{guard(p+'/x');return _push(ref(db,p),v)},
 remove:p=>{guard(p);return _remove(ref(db,p))}};
window.__perfGuard=okPath;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tile=(k,v,n)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n||''}</div></div>`;
const sc=v=>v==null?'<span class="pill nv">—</span>':`<span class="sc ${v>=80?'g':v>=65?'a':'rd'}">${Math.round(v)}</span>`;
const bar=v=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%;background:${v>=80?'#2E8B6A':v>=65?'#C27C0E':'#C0392B'}"></i></div>`;
const toHR=()=>{location.href='./index.html'};$('toHR').onclick=toHR;$('toHR2').onclick=toHR;

let ROLE='',ME='',MYKEY='',PG='overview';
const P={settings:{},goals:{},dgoals:{},kpis:{},families:{},assign:{},actuals:{},myAssign:{}};let EMP={};

function gate(t,m,b){$('gate').classList.remove('hide');$('app').classList.add('hide');$('gateT').textContent=t;$('gateM').textContent=m;$('gateB').innerHTML=b||''}
gate('Opening Performance…','Checking your sign-in.');
onAuthStateChanged(auth,async u=>{
 if(!u){$('who').textContent='Not signed in';gate('Please sign in through the HR Portal','Performance uses the same login as the HR Portal. Sign in there, then open Performance from the menu in the same browser tab.','<button class="btn p" onclick="location.href=\'./index.html\'">Go to the HR Portal</button>');return}
 const em=(u.email||'').toLowerCase();
 if(ADMINS[em]){ROLE='hr';ME=ADMINS[em]}else if(em===CEO){ROLE='ceo';ME='Cem Kapancioglu'}
 else{let m=null;try{m=(await get(ref(db,'staffMap/'+u.uid))).val()}catch(e){}
  if(!m||m.enabled!==true){gate('No access','Your HR Portal access is not active. Please contact HR.');return}
  ROLE='staff';MYKEY=m.empKey;try{const v=(await get(ref(db,'staffView/'+m.empKey))).val()||{};ME=v.name||'';EMP[m.empKey]=v}catch(e){}}
 $('who').innerHTML='Signed in · <b>'+esc(ME||em)+'</b> · '+({hr:'HR',ceo:'CEO (view)',staff:'Staff'}[ROLE]);
 listen();
});
function listen(){
 const open=(p,k,cb)=>onValue(ref(db,p),s=>{P[k]=s.val()||{};cb&&cb();draw()},e=>{P[k]={};draw()});
 open('perf/settings','settings');
 if(ROLE==='staff'){open('perf/kpis','kpis');open('perf/families','families');open('perf/goals','goals');open('perf/dgoals','dgoals');open('perf/assign/'+MYKEY,'myAssign');return}
 ['goals','dgoals','kpis','families','assign','actuals'].forEach(k=>open('perf/'+k,k));
 onValue(ref(db,'employees'),s=>{EMP=s.val()||{};draw()},()=>{EMP={}});
}
const VIS=()=>(P.settings&&P.settings.visibility)||'hr';
const CYCLE=()=>(P.settings&&P.settings.cycle)||'2027-Q1';
const active=()=>Object.entries(EMP).filter(([k,e])=>e&&e.status!=='Inactive'&&e.name);

// ── role families: which family fits a person (designation first, then department, then grade)
// keywords of 3 letters or fewer (HR, QS, PRO, MEP, HSE) must be whole words; longer ones may be the start of a word
const kwRe=k=>{k=String(k||'').trim().toLowerCase();if(!k)return null;const s=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return new RegExp('(^|[^a-z])'+s+(k.length<=3?'($|[^a-z])':''))};
const hit=(keys,txt)=>(keys||[]).some(k=>{const r=kwRe(k);return r&&r.test(txt)});
function famFor(e){const F=Object.entries(P.families||{}).sort((a,b)=>(a[1].order||99)-(b[1].order||99));const d=String(e.desig||'').toLowerCase(),dp=String(e.dept||'').toLowerCase();
 if(String(e.grade||'')==='Labour'){const lead=F.find(([id,f])=>f.leadsCrew&&hit(f.desigKeys,d));if(lead)return lead[0];const l=F.find(([id,f])=>f.labour);if(l)return l[0]}
 for(const [id,f] of F){if(!f.labour&&hit(f.desigKeys,d))return id}
 for(const [id,f] of F){if(!f.labour&&hit(f.deptKeys,dp))return id}
 return ''}
function famItems(f){return (f&&f.items)||[]}
function famWeight(f){return famItems(f).reduce((s,x)=>s+(+x.w||0),0)}
// ── weighted scoring (achievement per KPI capped at 100%; manager rating out of 5 vs target)
function ach(k,val){if(val==null||val===''||isNaN(+val))return null;const t=+k.target,v=+val;if(!(t>0))return null;let a=k.dir==='down'?(v<=0?1:t/v):v/t;return Math.max(0,Math.min(1,a))}
function scoreFor(empKey,fid){const f=P.families[fid];if(!f)return {score:null,parts:[]};const A=((P.actuals||{})[CYCLE()]||{})[empKey]||{};let sw=0,ss=0,parts=[];
 famItems(f).forEach(it=>{const k=P.kpis[it.kpi];if(!k)return;const a=ach(k,(A[it.kpi]||{}).val);parts.push({it,k,a,val:(A[it.kpi]||{}).val});if(a!=null){sw+=+it.w;ss+=+it.w*a}});
 return {score:sw?ss/sw*100:null,cover:famWeight(f)?Math.round(sw/famWeight(f)*100):0,parts}}

// ── navigation
const NAV={hr:[['overview','📋 Overview & set-up'],['goals','🎯 Company & department goals'],['kpis','📚 KPI library'],['families','🧩 Role-family scorecards'],['assign','👥 Assign scorecards'],['scores','🧮 Weighted scoring'],['settings','⚙️ Cycle & visibility']],
 ceo:[['overview','📋 Overview'],['goals','🎯 Company & department goals'],['kpis','📚 KPI library'],['families','🧩 Role-family scorecards'],['assign','👥 Scorecards by person'],['scores','🧮 Weighted scoring']],
 staff:[['mine','🎯 My scorecard']]};
function draw(){if(!ROLE)return;
 if(ROLE==='staff'&&VIS()==='hr'){gate('Performance is being prepared','HR is setting up the new performance scorecards. You will see your own scorecard here once it is switched on.','<button class="btn p" onclick="location.href=\'./index.html\'">Back to the HR Portal</button>');return}
 $('gate').classList.add('hide');$('app').classList.remove('hide');
 const N=NAV[ROLE];if(!N.some(x=>x[0]===PG))PG=N[0][0];
 $('nav').innerHTML=N.map(([k,l])=>`<div class="ni ${k===PG?'on':''}" data-p="${k}">${l}</div>`).join('');
 $('nav').querySelectorAll('[data-p]').forEach(n=>n.onclick=()=>{PG=n.dataset.p;draw();window.scrollTo(0,0)});
 $('main').innerHTML=(V[PG]||V.overview)();wire()}
const RO=()=>ROLE==='ceo'?'<div class="banner i">View only. Changes are made by HR.</div>':'';
const canEdit=()=>ROLE==='hr';
let FLT={q:'',fam:'',st:''};

const V={
overview(){const A=active(),fams=Object.keys(P.families).length,kp=Object.keys(P.kpis).length,as=Object.keys(P.assign).length,ack=Object.values(P.assign).filter(a=>a&&a.ack).length;
 const unm=A.filter(([k,e])=>!((P.assign[k]||{}).fam)&&!famFor(e)).length;
 const badW=Object.values(P.families).filter(f=>famWeight(f)!==100).length;
 const empty=!kp&&!fams;
 return `<h1>Performance · overview</h1><p class="sub">Cycle <b>${esc(CYCLE())}</b> · visible to: <b>${{hr:'HR only (set-up)',pilot:'HR, CEO and pilot staff',all:'everyone'}[VIS()]}</b></p>${RO()}
 ${empty&&canEdit()?`<div class="banner"><b>Start here:</b> load the starter set (draft company goals, KPIs for every department and role-family scorecards). Everything is marked <i>draft</i> and can be edited, deleted or confirmed with each head. Nothing changes in the HR Portal.<div style="margin-top:8px"><button class="btn gd" id="seed">Load starter set</button></div></div>`:''}
 <div class="tiles">${tile('Company goals',Object.keys(P.goals).length,Object.values(P.goals).filter(g=>g.status==='agreed').length+' agreed')+tile('KPIs in the library',kp,Object.values(P.kpis).filter(k=>k.src!=='manager').length+' measurable')+tile('Role-family scorecards',fams,badW?badW+' weights not 100':'all weights 100')+tile('People with a scorecard',as+' / '+A.length,unm?unm+' with no matching family':'everyone matched')+tile('Acknowledged',ack,'by staff')}</div>
 <div class="card"><h2>Set-up steps (Phase 1)</h2><table>
 ${[['1','Company goals agreed with Mr. Cem','goals',Object.values(P.goals).some(g=>g.status==='agreed')],['2','Department goals linked to company goals','goals',Object.keys(P.dgoals).length>0],['3','KPI library checked with each head','kpis',kp>0&&Object.values(P.kpis).every(k=>k.status==='agreed')],['4','Role-family scorecards with weights adding to 100','families',fams>0&&!badW],['5','Scorecards assigned to every active person','assign',A.length>0&&as>=A.length],['6','Visibility switched on for the pilot or everyone','settings',VIS()!=='hr'],['7','Staff acknowledge their scorecards','assign',as>0&&ack>=as]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[3]?'<span class="pill g">Done</span>':'<span class="pill a">To do</span>'}</td><td><button class="btn sm" data-go="${r[2]}">Open</button></td></tr>`).join('')}</table></div>`},

goals(){const G=Object.entries(P.goals).sort((a,b)=>(a[1].order||0)-(b[1].order||0)),D=Object.entries(P.dgoals);
 return `<h1>Company &amp; department goals</h1><p class="sub">Every KPI links up to a department goal, and every department goal to a company goal.</p>${RO()}
 <div class="card"><h2>Company goals</h2><p class="note">Agreed with Mr. Cem (5 to 6 goals). Draft until agreed.</p>${canEdit()?'<div class="row"><button class="btn p" data-new="goal">+ Company goal</button></div>':''}
 <table><tr><th>Goal</th><th>How it is measured</th><th>Owner</th><th>Status</th><th></th></tr>${G.map(([id,g])=>`<tr><td><b>${esc(g.name)}</b><div class="note" style="margin:0">${esc(g.desc||'')}</div></td><td>${esc(g.measure||'')}</td><td>${esc(g.owner||'')}</td><td>${g.status==='agreed'?'<span class="pill g">Agreed</span>':'<span class="pill a">Draft</span>'}</td><td>${canEdit()?`<button class="btn sm" data-edit="goal:${id}">Edit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="note">No company goals yet.</td></tr>'}</table></div>
 <div class="card"><h2>Department goals</h2>${canEdit()?'<div class="row"><button class="btn p" data-new="dgoal">+ Department goal</button></div>':''}
 <table><tr><th>Department goal</th><th>Department</th><th>Supports company goal</th><th>Status</th><th></th></tr>${D.map(([id,g])=>`<tr><td><b>${esc(g.name)}</b></td><td>${esc(g.dept||'')}</td><td>${esc((P.goals[g.goalId]||{}).name||'— not linked')}</td><td>${g.status==='agreed'?'<span class="pill g">Agreed</span>':'<span class="pill a">Draft</span>'}</td><td>${canEdit()?`<button class="btn sm" data-edit="dgoal:${id}">Edit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="note">No department goals yet.</td></tr>'}</table></div>`},

kpis(){const K=Object.entries(P.kpis).filter(([id,k])=>(!FLT.q||(k.name+' '+(k.dept||'')+' '+(k.def||'')).toLowerCase().includes(FLT.q.toLowerCase()))&&(!FLT.st||k.src===FLT.st)).sort((a,b)=>String(a[1].dept).localeCompare(b[1].dept)||String(a[1].name).localeCompare(b[1].name));
 return `<h1>KPI library</h1><p class="sub">Configurable, not hard-coded. Each KPI: definition, unit, target, direction, period, and where its figure comes from.</p>${RO()}
 <div class="card"><div class="row"><input id="fq" placeholder="Search KPI or department" value="${esc(FLT.q)}" style="flex:1;min-width:200px"><select id="fst"><option value="">All sources</option><option value="auto"${FLT.st==='auto'?' selected':''}>Automatic (from data)</option><option value="manual"${FLT.st==='manual'?' selected':''}>Manual with evidence</option><option value="manager"${FLT.st==='manager'?' selected':''}>Manager rating</option></select>${canEdit()?'<button class="btn p" data-new="kpi">+ New KPI</button>':''}</div>
 <div class="tw"><table><tr><th>KPI</th><th>Department</th><th>Target</th><th>Period</th><th>Source</th><th>Status</th><th></th></tr>${K.map(([id,k])=>`<tr><td><b>${esc(k.name)}</b><div class="note" style="margin:0">${esc(k.def||'')}</div></td><td>${esc(k.dept||'')}</td><td>${k.dir==='down'?'≤ ':'≥ '}${esc(k.target)} ${esc(k.unit||'')}</td><td>${esc(k.period||'')}</td><td><span class="pill ${k.src==='auto'?'g':k.src==='manager'?'nv':'a'}">${{auto:'automatic',manual:'manual + evidence',manager:'manager rating'}[k.src]||k.src}</span><div class="note" style="margin:0">${esc(k.srcName||'')}</div></td><td>${k.status==='agreed'?'<span class="pill g">Agreed</span>':'<span class="pill a">Draft</span>'}</td><td>${canEdit()?`<button class="btn sm" data-edit="kpi:${id}">Edit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="note">No KPIs yet.</td></tr>'}</table></div></div>`},

families(){const F=Object.entries(P.families).sort((a,b)=>String(a[1].name).localeCompare(b[1].name));
 return `<h1>Role-family scorecards</h1><p class="sub">One scorecard per role family (not per person): 3 to 5 KPIs plus the manager's rating. Weights must add up to 100.</p>${RO()}
 ${canEdit()?'<div class="row"><button class="btn p" data-new="family">+ Role family</button></div>':''}
 ${F.map(([id,f])=>{const w=famWeight(f),n=active().filter(([k,e])=>((P.assign[k]||{}).fam||famFor(e))===id).length;const dataW=famItems(f).filter(i=>(P.kpis[i.kpi]||{}).src!=='manager').reduce((s,i)=>s+(+i.w||0),0);
 return `<div class="card"><div class="row" style="margin:0 0 6px"><h2 style="flex:1;margin:0">${esc(f.name)} ${f.labour?'<span class="pill nv">crew level</span>':''} ${f.status==='agreed'?'<span class="pill g">Agreed</span>':'<span class="pill a">Draft</span>'}</h2><span class="note" style="margin:0">${n} people · ${dataW}% data / ${w-dataW}% manager</span>${canEdit()?`<button class="btn sm" data-edit="family:${id}">Edit</button>`:''}</div>
 <p class="note">Matches designations containing: ${esc((f.desigKeys||[]).join(', ')||'—')} · departments containing: ${esc((f.deptKeys||[]).join(', ')||'—')}${f.labour?' · and Labour grade staff not matched elsewhere':''}. Supports: ${esc((P.dgoals[f.dgoalId]||{}).name||'— no department goal linked')}</p>

function wire(){

 document.querySelectorAll('[data-as]').forEach(s=>s.onchange=async()=>{const k=s.dataset.as,v=s.value,old=P.assign[k]||{};try{if(!v){await W.remove('perf/assign/'+k)}else{await W.set('perf/assign/'+k,{fam:v,cycle:CYCLE(),at:Date.now(),by:ME,...(old.fam===v&&old.ack?{ack:old.ack}:{})})}await hist('Scorecard for '+((EMP[k]||{}).name||k)+': '+((P.families[v]||{}).name||'removed'))}catch(e){alert(e.message)}});
 if($('assignAll'))$('assignAll').onclick=async()=>{const L=active().filter(([k,e])=>!(P.assign[k]||{}).fam&&famFor(e));if(!confirm('Assign the suggested scorecard to '+L.length+' people?'))return;const up={};L.forEach(([k,e])=>up['assign/'+k]={fam:famFor(e),cycle:CYCLE(),at:Date.now(),by:ME});try{await W.update('perf',up);await hist('Assigned suggested scorecards to '+L.length+' people')}catch(e){alert(e.message)}};
 document.querySelectorAll('[data-emp]').forEach(b=>b.onclick=()=>{FLT.emp=b.dataset.emp;draw();window.scrollTo(0,0)});
 document.querySelectorAll('[data-act]').forEach(x=>x.onchange=async()=>{const [ek,kp]=x.dataset.act.split('|'),val=x.value.trim();try{if(val==='')await W.remove('perf/actuals/'+CYCLE()+'/'+ek+'/'+kp);else{if(isNaN(+val))throw new Error('Enter a number.');await W.set('perf/actuals/'+CYCLE()+'/'+ek+'/'+kp,{val:+val,at:Date.now(),by:ME,src:'typed'})}}catch(e){alert(e.message)}});
 if($('sSave'))$('sSave').onclick=async()=>{try{const vis=$('sVis').value;if(vis!=='hr'&&VIS()==='hr'&&!confirm('Switch Performance on for staff? Do this only after the company goals and the split are agreed with Mr. Cem and staff have been informed.'))return;await W.set('perf/settings',{cycle:$('sCyc').value,visibility:vis,dataShare:+$('sSplit').value,upd:Date.now(),by:ME});await hist('Settings: cycle '+$('sCyc').value+', visibility '+vis);$('sMsg').textContent='Saved.'}catch(e){$('sMsg').textContent=e.message}};
 if($('ackBtn'))$('ackBtn').onclick=async()=>{try{await W.set('perf/assign/'+MYKEY+'/ack',{at:serverTimestamp()})}catch(e){alert('Could not save: '+e.message)}};
}
